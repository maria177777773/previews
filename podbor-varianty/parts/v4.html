  if(mx!=null&&!(p.cena!=null&&p.cena_za==='за гостя'&&p.cena<=mx))un.push('budget');
  var w=0;un.forEach(function(u){w+=W[u]});
  var comp=(p.lyudi?1:0)+(p.vremya?1:0)+(p.cena!=null?1:0);
  var pg=(p.cena!=null&&p.cena_za==='за гостя')?p.cena:1e9;
  return {p:p,unmet:un,w:w,exact:t.exact,comp:comp,pg:pg}
 });
 rows.sort(function(a,b){return a.w-b.w||(b.exact-a.exact)||b.comp-a.comp||a.pg-b.pg||a.p.name.localeCompare(b.p.name,'ru')});
 return {all:rows,strict:rows.filter(function(r){return !r.unmet.length}).length}
}
function count(st){return search(st).strict}
function priceText(p){if(p.cena==null)return 'цена по запросу';return 'от '+money(p.cena)+' ₽'+(p.cena_za==='за гостя'?' за гостя':p.cena_za==='за программу'?' за программу':'')}
function metaText(p){var a=[];if(p.lyudi)a.push(p.lyudi+' человек');if(p.vremya)a.push(p.vremya);a.push(priceText(p));return a.join(' · ')}
function unmetText(r,st){
 var a=[];
 r.unmet.forEach(function(u){
  if(u==='topic')a.push(st.topic==='sport'||st.topic==='tvorch'?'другой формат':'другой сезон');
  if(u==='place')a.push('другое место');
  if(u==='budget')a.push(r.pg<1e9?'чуть выше бюджета':'цену уточним в КП');
 });
 return a.join(', ')
}
function cardHTML(r,st){
 var p=r.p,near=r.unmet.length?'<p class="near">Ближайшее по условиям: '+esc(unmetText(r,st||{}))+'</p>':'';
 return '<article class="pcard" data-pcard="'+esc(p.slug)+'"><div class="ph" role="img" aria-label="Фото: '+esc(p.name)+'"><span>'+esc(p.name)+'</span></div><div class="pbody"><h3>'+esc(p.name)+'</h3><p class="meta">'+esc(metaText(p))+'</p>'+near+'<div class="pact"><button class="btn" type="button" data-kp="'+esc(p.slug)+'">Получить КП за 10 минут</button><a class="more" href="'+BASE+esc(p.slug)+'/" target="_blank" rel="noopener">О программе →</a></div></div></article>'
}
function cardsHTML(rows,st){return rows.map(function(r){return cardHTML(r,st)}).join('')}
function stateLabel(st){
 var a=[];
 if(st.topic!=='any')a.push(lab(TOPICS,st.topic));
 if(st.place!=='any')a.push(lab(PLACES,st.place));
 if(st.budget!=='any')a.push(budgetLabel(st.budget)+' за гостя');
 return a.length?a.join(' · '):'без условий'
}
var NOTE='Площадку подберём под выбранную программу: напишите пожелания в форме КП.';
function summaryText(res,st){
 var n=res.strict,k=Math.min(3,res.all.length);
 if(n>=3)return 'Подобрали '+k+' '+plural(k,['программу','программы','программ'])+' из '+n+' подходящих';
 if(n>0)return 'Точных совпадений: '+n+', остальное ближайшее';
 return 'Точных совпадений нет, показываем ближайшие'
}
function summaryHTML(res,st){return '<p class="sum"><b>'+esc(summaryText(res,st))+'</b><span>'+esc(stateLabel(st))+'</span></p>'+(st._note?'<p class="note">'+NOTE+'</p>':'')}
function chips(q,list,cur){return list.map(function(o){return '<button type="button" class="opt" data-q="'+q+'" data-v="'+o.id+'" aria-pressed="'+(String(cur)===o.id)+'">'+esc(o.label)+'</button>'}).join('')}
function scnCount(id){var n=count(scn(id));return n+' '+plural(n,['программа','программы','программ'])}
var modal=null,curProg=null;
function ensureModal(){
 if(modal)return modal;
 modal=document.createElement('div');modal.className='kp-ov';modal.hidden=true;
 modal.innerHTML='<div class="kp" role="dialog" aria-modal="true" aria-labelledby="kp-t"><button class="kp-x" type="button" aria-label="Закрыть">×</button><h3 id="kp-t">Получить КП за 10 минут</h3><p class="kp-prog"></p><form novalidate><label>Сколько гостей<input name="n" type="number" min="1" inputmode="numeric" autocomplete="off"></label><label>Как к вам обращаться<input name="name" type="text" autocomplete="name"></label><label>Телефон или e-mail<input name="c" type="text" autocomplete="off"></label><p class="kp-err" role="alert"></p><button class="btn" type="submit">Получить КП</button></form><p class="kp-ok" hidden></p></div>';
 document.body.appendChild(modal);
 modal.addEventListener('click',function(e){if(e.target===modal||e.target.closest('.kp-x'))closeKP()});
 modal.querySelector('form').addEventListener('submit',function(e){
  e.preventDefault();var f=e.target,n=Number(f.n.value),c=f.c.value.trim(),err=modal.querySelector('.kp-err');
  if(!(n>0)){err.textContent='Укажите, сколько будет гостей';return}
  if(!c){err.textContent='Укажите телефон или e-mail';return}
  err.textContent='';f.hidden=true;var ok=modal.querySelector('.kp-ok');ok.hidden=false;
  ok.textContent='Заявка принята. Пришлём КП по программе «'+(curProg?curProg.name:'')+'» на '+n+' гостей.'
 });
 document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!modal.hidden)closeKP()});
 return modal
}
function openKP(slug){
 var p=PROGRAMS.filter(function(x){return x.slug===slug})[0];if(!p)return;curProg=p;
 var m=ensureModal();m.querySelector('.kp-prog').textContent='Программа «'+p.name+'»';
 var f=m.querySelector('form');f.reset();f.hidden=false;m.querySelector('.kp-ok').hidden=true;m.querySelector('.kp-err').textContent='';
 m.hidden=false;try{f.n.focus()}catch(e){}
}
function closeKP(){if(modal)modal.hidden=true}
document.addEventListener('click',function(e){var b=e.target.closest&&e.target.closest('[data-kp]');if(b){e.preventDefault();openKP(b.getAttribute('data-kp'))}});
function reveal(el){if(el&&el.scrollIntoView){try{el.scrollIntoView({block:'nearest',behavior:'smooth'})}catch(e){}}}
window.PB={PROGRAMS:PROGRAMS,TOPICS:TOPICS,PLACES:PLACES,BUDGETS:BUDGETS,SCENARIOS:SCENARIOS,esc:esc,money:money,plural:plural,full:full,scn:scn,setQ:setQ,lab:lab,search:search,count:count,priceText:priceText,metaText:metaText,cardHTML:cardHTML,cardsHTML:cardsHTML,stateLabel:stateLabel,summaryHTML:summaryHTML,summaryText:summaryText,chips:chips,scnCount:scnCount,budgetLabel:budgetLabel,openKP:openKP,reveal:reveal,NOTE:NOTE,lower:lower};
})();
</script>
<script id="pb-variant">
(function(){
var PB=window.PB,st=PB.full({}),shown=3,$=function(s){return document.querySelector(s)};
$('#f-scn').innerHTML=PB.SCENARIOS.map(function(s){return '<button type="button" class="opt" data-scn="'+s.id+'" aria-pressed="false">'+PB.esc(s.label)+'</button>'}).join('');
$('#f-topic').innerHTML=PB.chips('topic',PB.TOPICS,'any');
$('#f-place').innerHTML=PB.chips('place',PB.PLACES,'any');
$('#f-budget').innerHTML=PB.chips('budget',PB.BUDGETS,'any');
function render(){
 ['topic','place','budget'].forEach(function(q){document.querySelectorAll('#f-'+q+' .opt').forEach(function(b){b.setAttribute('aria-pressed',String(st[q]===b.getAttribute('data-v')))})});
 document.querySelectorAll('#f-scn .opt').forEach(function(b){b.setAttribute('aria-pressed',String(b.getAttribute('data-scn')===st._scn))});
 var r=PB.search(st),n=Math.min(shown,r.all.length);
 $('#stat').innerHTML=PB.summaryHTML(r,st)+(st._note?'':'');
 $('#grid').innerHTML=PB.cardsHTML(r.all.slice(0,n),st);
 var mb=$('#more');mb.hidden=n>=r.all.length;
}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-scn]');
 if(t){st=PB.scn(t.getAttribute('data-scn'));shown=3;render();return}
 var q=e.target.closest('.fbar [data-q]');
 if(q){PB.setQ(st,q.getAttribute('data-q'),q.getAttribute('data-v'));shown=3;render();return}
 if(e.target.closest('#more')){shown+=3;render()}
});
render();
})();
</script>
</body>
