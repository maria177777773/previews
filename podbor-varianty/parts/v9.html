.pb-root,.pb-root *{box-sizing:border-box}
.pb-root{--g:#0aba59;--ink:#0a0a0a;--mut:#5f6368;--line:#e1e1e1;--card:#f2f4f9;--panel:#eff8ef;--b1:#0aba59;--b2:#0a0a0a;--tt:TTCommonsPro,Arial,sans-serif;--rb:Roboto,Arial,sans-serif;--fw:700;--fs:600;
 font:400 17px/1.6 var(--rb);color:var(--ink);background:#fff;text-align:left;letter-spacing:0}
.pb-root button,.pb-root input,.pb-root select,.pb-root textarea{font-family:inherit;box-shadow:none;text-shadow:none}
.pb-root [hidden]{display:none!important}
.pb-root h2,.pb-root h3,.pb-root h4,.pb-root p,.pb-root ul,.pb-root li{margin:0;padding:0;text-transform:none}
.pb-root ul{list-style:none}
.pb-root a{text-decoration:none}
.pb-root a:focus-visible,.pb-root input:focus-visible,.pb-root select:focus-visible,.pb-root textarea:focus-visible,.pb-root button:focus-visible{outline:2px solid var(--ink)!important;outline-offset:2px!important}
.pb-in{max-width:1280px;margin:0 auto}
.pb-hd{margin-bottom:28px}
.pb-root .pb-h2{font:var(--fw) 42px/1.14 var(--tt)!important;color:var(--ink);letter-spacing:-.4px}
.pb-gr{color:var(--g)}
.pb-sub{font:400 20px/1.4 var(--rb);color:var(--mut);max-width:750px;margin-top:12px!important}
.pb-btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:35px;background:var(--b1);color:#fff;font:var(--fw) 18px/1.1 var(--tt)!important;border:2px solid var(--b1);cursor:pointer;text-align:center}
.pb-btn:hover{background:var(--b2);border-color:var(--b2);color:#fff}
.pb-btn[disabled]{opacity:.6;cursor:default}
.pb-opt{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:35px;border:1px solid var(--line);background:#fff;font:var(--fs) 17px/1.1 var(--tt)!important;color:var(--ink);cursor:pointer;text-align:center}
.pb-opt:hover{border-color:var(--ink)}
.pb-opt[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.pb-opt[aria-pressed="true"]:hover{background:var(--ink);border-color:var(--ink)}
.pb-row{display:flex;flex-wrap:wrap;gap:10px}
.pb-pills{margin-bottom:28px}
.pb-phrase{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:36px 32px;margin-bottom:32px;font:var(--fw) 34px/2.1 var(--tt);color:var(--ink);letter-spacing:-.4px}
.pb-slot{position:relative;display:inline-block}
.pb-sbtn{font:inherit!important;letter-spacing:inherit;color:var(--g);background:#fff;border:2px solid var(--g);border-radius:14px;padding:0 14px;line-height:1.5;cursor:pointer;display:inline-flex;align-items:center;gap:10px;vertical-align:baseline}
.pb-sbtn:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.pb-sbtn i{width:10px;height:10px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg) translateY(-3px)}
.pb-smenu{position:absolute;left:0;top:calc(100% + 6px);z-index:20;margin:0;padding:8px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:16px;min-width:240px;max-height:min(62vh,430px);overflow:auto;font:var(--fs) 19px/1.2 var(--tt);letter-spacing:0}
.pb-smenu button{width:100%;text-align:left;min-height:48px;padding:0 14px;border:0;border-radius:10px;background:transparent;font:inherit!important;color:var(--ink);cursor:pointer}
.pb-smenu button:hover{background:var(--ink);color:#fff}
.pb-smenu button[aria-selected="true"]{color:var(--g)}
.pb-smenu button[aria-selected="true"]:hover{color:#fff}
.pb-inp{font:inherit;letter-spacing:inherit;color:var(--g);background:#fff;border:2px solid var(--g);border-radius:14px;padding:0 10px;line-height:1.5;text-align:center;vertical-align:baseline;max-width:100%;margin:0}
.pb-inp.pb-n{width:3.4em}.pb-inp.pb-m{width:6.2em}
.pb-cust{display:inline-flex;align-items:stretch;vertical-align:baseline}
.pb-cust .pb-inp{border-radius:14px 0 0 14px;border-right:0}
.pb-cust .pb-sarr{border-radius:0 14px 14px 0;padding:0 12px}
.pb-err{color:#b3261e;font:400 16px/1.4 var(--rb);margin:0 0 14px!important}
.pb-sechd{font:var(--fw) 30px/1.2 var(--tt)!important;color:var(--ink);margin:40px 0 8px!important}
.pb-sum{margin:0 0 18px!important;font:400 18px/1.45 var(--rb);color:var(--mut)}

.pb-note{margin:0 0 18px!important;font:400 17px/1.45 var(--rb);color:#234438;background:var(--panel);border-left:3px solid var(--g);border-radius:0 10px 10px 0;padding:10px 14px}
.pb-grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.pb-pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.pb-ph{aspect-ratio:21/9;background:#e4e7ec;display:flex;align-items:center;justify-content:center;padding:12px;text-align:center}
.pb-ph span{font:var(--fs) 18px/1.2 var(--tt);color:var(--mut)}

.pb-more{font:var(--fw) 18px/1.2 var(--tt);color:var(--g);text-align:center;min-height:30px}
.pb-more:hover{color:var(--ink)}

.pb-chk input{width:24px;height:24px;accent-color:var(--g);flex:none;cursor:pointer;margin:0}
.pb-tot{font:var(--fw) 19px/1.3 var(--tt);color:var(--ink)}
.pb-tot.pb-no{font:400 16px/1.4 var(--rb);color:var(--mut)}
.pb-root .pb-grp{font:var(--fw) 22px/1.2 var(--tt)!important;color:var(--ink);margin:28px 0 14px!important}
.pb-form{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:32px;margin-top:48px}
.pb-root .pb-form h3{font:var(--fw) 30px/1.2 var(--tt)!important;color:var(--ink);margin:0 0 16px!important}
.pb-fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.pb-fgrid label{display:block;font:500 16px/1.3 var(--rb);color:var(--mut)}
.pb-fgrid .pb-full{grid-column:1/-1}

.pb-form textarea{min-height:96px;resize:vertical}
.pb-auto{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 16px}
.pb-auto p{margin:0 0 6px!important;font:500 17px/1.4 var(--rb);color:var(--ink)}
.pb-auto ul{margin:6px 0 0;padding-left:22px;list-style:disc;font:400 16px/1.5 var(--rb);color:var(--ink)}
.pb-auto b{font:var(--fw) 16px var(--tt);color:var(--mut)}
.pb-form .pb-btn{margin-top:8px;width:100%;max-width:360px}
.pb-priv{font:400 14px/1.4 var(--rb);color:var(--mut);margin-top:12px!important}
.pb-priv a{color:var(--ink);text-decoration:underline}
.pb-done{border:1px solid var(--g);background:var(--panel);border-radius:16px;padding:32px;margin-top:48px}
.pb-root .pb-done h3{font:var(--fw) 30px/1.2 var(--tt)!important;color:var(--ink);margin:0 0 8px!important}
.pb-done p{font:400 18px/1.45 var(--rb);margin:0 0 6px!important}
@media(max-width:1000px){.pb-phrase{font-size:27px}.pb-grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.pb-root .pb-h2{font-size:28px!important}.pb-sub{font-size:18px}.pb-phrase{font-size:21px;padding:18px 12px;line-height:2.2}.pb-smenu{min-width:200px;font-size:17px}.pb-grid3{grid-template-columns:1fr;gap:16px}.pb-fgrid{grid-template-columns:1fr}.pb-form,.pb-done{padding:20px 16px}.pb-sechd{font-size:25px!important}.pb-sum b{display:block;margin:0 0 4px}.pb-inp.pb-m{width:5.4em}}

var DRY=/[?&]pb_dry=1/.test(location.search);
var $=function(s){return ROOT.querySelector(s)};
var ADJ=[{id:'any',label:'любой'},{id:'sport',label:'спортивный'},{id:'tvorch',label:'творческий'},{id:'biz',label:'бизнес-игра'},{id:'cook',label:'кулинарный'},{id:'neuro',label:'с нейросетями'},{id:'ny',label:'новогодний'},{id:'zima',label:'зимний'},{id:'leto',label:'летний'}];
var WH=[{id:'any',label:'в любом месте'},{id:'room',label:'в помещении'},{id:'street',label:'на улице'},{id:'trip',label:'на выезде'}];
function money(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
var PEOPLE_L=[20,30,50,100,150,200,300,500,1000].map(function(v){return {id:String(v),label:String(v)}}).concat([{id:'custom',label:'Свой вариант…'}]);
var BUDGET_L=[150000,200000,300000,500000,700000,1000000,2000000].map(function(v){return {id:String(v),label:money(v)}}).concat([{id:'any',label:'не важно'},{id:'custom',label:'Свой вариант…'}]);
var SCN=[
{id:'trip',label:'Выезд за город',s:{place:'trip'}},
{id:'venue',label:'Подобрать площадку',s:{},note:true},
{id:'ny',label:'Новый год',s:{topic:'ny'}},
{id:'zima',label:'Зимний тимбилдинг',s:{topic:'zima'}},
{id:'leto',label:'Летний на природе',s:{topic:'leto',place:'street'}},
{id:'room',label:'В офисе или зале',s:{place:'room'}},
{id:'sport',label:'Спортивный',s:{topic:'sport'}},
{id:'tvorch',label:'Творческий',s:{topic:'tvorch'}}
];
/* budget: число или null («не важно»); pc/bc: слот людей/бюджета показан полем ввода («Свой вариант…») */
var st={topic:'any',place:'any',people:100,budget:300000,pc:false,bc:false,scn:'',note:false};
var selected={},touched=false,lastList=[];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function k(n){return money(Math.round(n/1000)*1000)}
function lab(l,id){var o=l.filter(function(x){return x.id===id})[0];return o?o.label:''}
function low(s){return String(s||'').toLowerCase()}
function range(p){var m=/^(\d+)-(\d+)$/.exec(p.lyudi||'');return m?[+m[1],+m[2]]:null}
function total(p,n){if(p.cena==null||!p.cena_za)return null;if(p.cena_za==='за гостя')return p.cena*n;if(p.cena_za==='за программу')return p.cena;return null}
function topicOk(p,t){
 if(t==='any')return true;
 var f=low(p.format),s=low(p.sezon);
 if(t==='sport')return f.indexOf('спорт')>-1;
 if(t==='tvorch')return f.indexOf('творчество')>-1;
 if(t==='biz')return f.indexOf('бизнес-игра')>-1;
 if(t==='cook')return f.indexOf('кулинария')>-1;
 if(t==='neuro')return f.indexOf('нейросети')>-1;
 var key={ny:'новый год',zima:'зима',leto:'лето'}[t];
 if(s.indexOf(key)>-1||s.indexOf('круглый')>-1)return true;
 if(!s){return !((t==='ny'||t==='zima')&&p.mesto==='улица')}
 return false
}
function placeOk(p,pl){
 if(pl==='any')return true;
 if(pl==='trip')return p.vyezd==='да';
 if(pl==='room')return p.mesto==='помещение'||p.mesto==='оба'||p.ofis==='да';
 if(pl==='street')return p.mesto==='улица'||p.mesto==='оба';
 return true
}
function search(){
 var n=st.people,B=st.budget;
 var rows=PROGRAMS.map(function(p){
  var un=[],r=range(p),tot=total(p,n),w=0;
  if(!topicOk(p,st.topic)){un.push((st.topic==='ny'||st.topic==='zima'||st.topic==='leto')?'другой сезон':'другой формат');w+=4}
  if(!placeOk(p,st.place)){un.push('другое место');w+=3}
  if(r){
   if(n<r[0]){un.push('рассчитана на группы от '+r[0]);w+=2+(r[0]-n)/1000}
   else if(n>r[1]){un.push('рассчитана на группы до '+r[1]);w+=2+(n-r[1])/1000}
  }
  if(B!=null&&tot!=null&&tot>B){
   un.push(tot<=B*1.3?'чуть выше бюджета':'выше бюджета на '+k(tot-B)+' ₽');
   w+=1+(tot-B)/B
  }
  return {p:p,un:un,w:w,tot:tot,ok:!un.length}
 });
 var exact=rows.filter(function(r){return r.ok});
 exact.sort(function(a,b){
  if(a.tot==null&&b.tot==null)return a.p.name.localeCompare(b.p.name,'ru');
  if(a.tot==null)return 1;if(b.tot==null)return -1;
  return a.tot-b.tot||a.p.name.localeCompare(b.p.name,'ru')});
 var near=rows.filter(function(r){return !r.ok});
 near.sort(function(a,b){return a.w-b.w||a.p.name.localeCompare(b.p.name,'ru')});
 var need=Math.max(0,6-exact.length);
 return {exact:exact,near:near.slice(0,need)}
}
function metaText(p){var a=[],r=range(p);if(r)a.push(r[0]+' до '+r[1]+' человек');else a.push('число участников уточним в заявке');if(p.vremya)a.push(p.vremya);return a.join(' · ')}
function cardHTML(r){
 var p=r.p,sl=esc(p.slug);
 var price=r.tot!=null?'<p class="pb-tot">≈ '+k(r.tot)+' ₽ на вашу группу</p>':'<p class="pb-tot pb-no">цену посчитаем в заявке</p>';
 var near=r.un.length?'<p class="pb-near">Ближайшее: '+esc(r.un.join(', '))+'</p>':'';
 return '<article class="pb-pcard" data-pcard="'+sl+'"><div class="pb-ph" role="img" aria-label="Фото: '+esc(p.name)+'"><span>'+esc(p.name)+'</span></div><div class="pb-pbody"><h3>'+esc(p.name)+'</h3><p class="pb-meta">'+esc(metaText(p))+'</p>'+price+near+'<a class="pb-more" href="'+BASE+sl+'/" target="_blank" rel="noopener">О программе →</a><label class="pb-chk"><input type="checkbox" data-add="'+sl+'"'+(selected[p.slug]?' checked':'')+'>Добавить в заявку</label></div></article>'
}
function menuHTML(q,list,curId){
 return '<ul class="pb-smenu" role="listbox" hidden>'+list.map(function(o){return '<li><button type="button" role="option" aria-selected="'+(o.id===curId)+'" data-q="'+q+'" data-v="'+o.id+'">'+esc(o.label)+'</button></li>'}).join('')+'</ul>'
}
function slot(q,list){
 var cur=list.filter(function(o){return o.id===st[q]})[0]||list[0];
 return '<span class="pb-slot"><button type="button" class="pb-sbtn" data-slot="'+q+'" aria-haspopup="listbox" aria-expanded="false">'+esc(cur.label)+'<i aria-hidden="true"></i></button>'+menuHTML(q,list,cur.id)+'</span>'
}
function numSlot(q){
 var isP=q==='people',list=isP?PEOPLE_L:BUDGET_L,cust=isP?st.pc:st.bc,val=st[q];
 var curId=cust?'custom':(val==null?'any':String(val));
 var cur=list.filter(function(o){return o.id===curId})[0]||list[0];
 if(cust){
  return '<span class="pb-slot pb-cust"><input class="pb-inp '+(isP?'pb-n':'pb-m')+'" id="'+(isP?'pb-in-n':'pb-in-m')+'" type="text" inputmode="numeric" autocomplete="off" aria-label="'+(isP?'Число человек':'Общий бюджет, рублей')+'" value="'+(isP?val:money(val))+'"><button type="button" class="pb-sbtn pb-sarr" data-slot="'+q+'" aria-haspopup="listbox" aria-expanded="false" aria-label="Выбрать из списка"><i aria-hidden="true"></i></button>'+menuHTML(q,list,curId)+'</span>'
 }
 return '<span class="pb-slot"><button type="button" class="pb-sbtn" data-slot="'+q+'" aria-haspopup="listbox" aria-expanded="false" aria-label="'+(isP?'Число человек':'Бюджет')+': '+esc(cur.label)+'">'+esc(cur.label)+'<i aria-hidden="true"></i></button>'+menuHTML(q,list,curId)+'</span>'
}
function budgetText(){return st.budget==null?'бюджет не важен':'бюджет до '+money(st.budget)+' ₽ всего'}
function phraseText(){
 return 'Нужен '+lab(ADJ,st.topic)+' тимбилдинг '+lab(WH,st.place)+' на '+st.people+' человек, '+budgetText()
}
function renderPhrase(){
 $('#pb-pills').innerHTML=SCN.map(function(s){return '<button type="button" class="pb-opt" data-scn="'+s.id+'" aria-pressed="'+(st.scn===s.id)+'">'+esc(s.label)+'</button>'}).join('');
 var bud=st.budget==null?'бюджет '+numSlot('budget'):'бюджет до '+numSlot('budget')+' ₽ всего';
 $('#pb-phrase').innerHTML='Нужен '+slot('topic',ADJ)+' тимбилдинг '+slot('place',WH)+' на '+numSlot('people')+' человек, '+bud
}
function renderRes(){
 var r=search(),list=r.exact.concat(r.near);
 lastList=list;
 var vis={};list.forEach(function(x){vis[x.p.slug]=1});
 if(!touched){selected={};list.slice(0,3).forEach(function(x){selected[x.p.slug]=1})}
 else{Object.keys(selected).forEach(function(s){if(!vis[s])delete selected[s]})}
 var h='<h3 class="pb-sechd">Что можем предложить</h3><p class="pb-sum"><b>'+(r.exact.length?((st.budget==null?'Подходят по людям: ':'Вписались в бюджет и по людям: ')+r.exact.length):'Точных совпадений нет, показываем ближайшие')+'</b><span>итог считаем на '+st.people+' человек, '+esc(budgetText())+'</span></p>';
 if(st.note)h+='<p class="pb-note">Площадку подберём под выбранную программу: напишите пожелания в заявке.</p>';
 if(r.exact.length)h+='<div class="pb-grid3">'+r.exact.map(cardHTML).join('')+'</div>';
 if(r.near.length)h+=(r.exact.length?'<h4 class="pb-grp">Ближайшие по условиям</h4>':'')+'<div class="pb-grid3">'+r.near.map(cardHTML).join('')+'</div>';
 $('#pb-res').innerHTML=h;
 renderForm()
}
function chosen(){return lastList.filter(function(x){return selected[x.p.slug]})}
var sent=false,sending=false;
function autoHTML(){
 var c=chosen();
 return '<div class="pb-auto" id="pb-auto"><p><b>Ваш запрос.</b> '+esc(phraseText())+'</p><p><b>Программы в заявке:</b> '+(c.length?c.length:'не выбраны')+'</p>'+(c.length?'<ul>'+c.map(function(x){return '<li>'+esc(x.p.name)+(x.tot!=null?', ≈ '+k(x.tot)+' ₽':', цену посчитаем в заявке')+'</li>'}).join('')+'</ul>':'<p>Отметьте программы в карточках или отправьте заявку, мы подберём сами.</p>')+'</div>'
}
function renderForm(){
 var box=$('#pb-formbox');
 if(sent)return;
 var f=box.querySelector('form');
 if(f){var a=box.querySelector('#pb-auto');if(a)a.outerHTML=autoHTML();return}
 box.innerHTML='<div class="pb-form"><h3>Оставить заявку</h3>'+autoHTML()+'<form novalidate><div class="pb-fgrid"><label>Имя<input type="text" name="name" autocomplete="name"></label><label>Телефон<input type="tel" name="contact" autocomplete="tel" inputmode="tel" placeholder="+7 (999) 123-45-67"></label><label>Куда написать<select name="messenger"><option>Telegram</option><option>Max</option></select></label><label>Дата мероприятия, если известна<input type="date" name="date"></label><label class="pb-full">Комментарий<textarea name="comment"></textarea></label></div><p class="pb-err" id="pb-ferr" hidden></p><button class="pb-btn" type="submit">Отправить заявку</button><p class="pb-priv">Нажимая кнопку, вы соглашаетесь с <a href="https://catalystrussia.ru/politika-confidencialnosti/" target="_blank" rel="noopener">политикой конфиденциальности</a>.</p></form></div>'
}
/* маска телефона: копия formatPhone из /interaction-update-20261105/forms-chat.js, строки 22-33 */
function formatPhone(value){
 var digits=value.replace(/\D/g,'');
 if(/^\s*\+7/.test(value)||(digits.length>10&&/^[78]/.test(digits)))digits=digits.slice(1);
 digits=digits.slice(0,10);
 if(!digits)return '+7 (';
 var result='+7 ('+digits.slice(0,3);
 if(digits.length>=3)result+=') ';
 if(digits.length>3)result+=digits.slice(3,6);
 if(digits.length>6)result+='-'+digits.slice(6,8);
 if(digits.length>8)result+='-'+digits.slice(8,10);
 return result
}
/* текст заявки в стиле buildMessage() из forms-chat.js: строки через \n, в конце «Телефон: …» */
function buildMessage(name,phone,F){
 var c=chosen(),fmt=(st.topic==='any'?'тимбилдинг':lab(ADJ,st.topic)+' тимбилдинг')+', '+lab(WH,st.place);
 var lines=['Здравствуйте! Помогите подобрать программу и рассчитать стоимость.','Формат: '+fmt,'Участников: '+st.people];
 if(F.date.value)lines.push('Когда: '+F.date.value);
 lines.push('Бюджет: '+(st.budget==null?'не важен':'до '+money(st.budget)+' ₽ всего'));
 lines.push('Запрос из подбора: '+phraseText());
 if(c.length){lines.push('Программы в заявке:');c.forEach(function(x){lines.push('- '+x.p.name+(x.tot!=null?', ≈ '+k(x.tot)+' ₽':', цену посчитаем в заявке'))})}
 lines.push('Меня зовут '+name+'.');
 var cm=F.comment.value.trim();if(cm)lines.push('Пожелания: '+cm);
 lines.push('Написать в: '+F.messenger.value);
 lines.push('Телефон: '+phone);
 return lines.join('\n')
}
function goal(n){
 try{
  if(typeof window.__ccGoal==='function'){window.__ccGoal(n);return}
  if(typeof window.ym==='function')window.ym(91307646,'reachGoal',n)
 }catch(e){}
}
function showErr(t){var e=$('#pb-ferr');e.textContent=t;e.hidden=false}
function submit(form){
 if(sending)return;
 var F=form.elements,name=F.name.value.trim(),raw=F.contact.value.trim(),digits=raw.replace(/\D/g,'');
 var ok=/^7\d{10}$/.test(digits)||/^8\d{10}$/.test(digits);
 if(!name){showErr('Укажите имя');F.name.focus();return}
 if(!ok){showErr('Введите номер полностью: +7 (999) 123-45-67.');F.contact.focus();return}
 var phone=formatPhone(raw);
 var payload={name:name,phone:phone,contact:phone,channel:'Телефон',comment:buildMessage(name,phone,F),program:'Подбор программы',source:'podbor',page:location.pathname};
 $('#pb-ferr').hidden=true;
 var btn=form.querySelector('button[type=submit]');btn.disabled=true;btn.textContent='Отправляем…';sending=true;
 function fail(){sending=false;btn.disabled=false;btn.textContent='Попробовать ещё раз';showErr('Не удалось отправить запрос. Данные сохранены в форме. Попробуйте ещё раз или напишите нам в мессенджере.')}
 function done(dup){
  sending=false;sent=true;
  if(!dup){goal('form_proposal');goal('lead_sent')}
  $('#pb-formbox').innerHTML='<div class="pb-done" role="status"><h3>Спасибо, ваш запрос отправлен</h3><p>'+esc(phraseText())+'</p><p>Перезвоним вам по номеру '+esc(phone)+'.</p><p>Работаем ежедневно с 8:00 до 22:00.</p></div>'
 }
 window.__pbLast=payload;
 if(DRY){console.log(JSON.stringify(payload,null,2));done(true);return}
 var ctl=typeof AbortController==='function'?new AbortController():null,tm=ctl?setTimeout(function(){ctl.abort()},15000):0;
 fetch(ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(payload),signal:ctl?ctl.signal:undefined})
  .then(function(r){return r.json().then(function(d){return {r:r,d:d}})})
  .then(function(x){clearTimeout(tm);if(!x.r.ok||!x.d||x.d.ok!==true)throw Error('lead');done(!!x.d.duplicate)})
  .catch(function(){clearTimeout(tm);fail()})
}
function parseNum(s){var v=parseInt(String(s).replace(/\D/g,''),10);return isNaN(v)?null:v}
function setNum(key,raw,max){
 var v=parseNum(raw),e=$('#pb-err');
 if(v==null||v<1||v>max){e.textContent=key==='people'?'Укажите число человек от 1 до '+max:'Укажите бюджет числом, например 250 000';e.hidden=false;return false}
 e.hidden=true;st[key]=v;st.scn='';st.note=false;return true
}
function closeAll(){ROOT.querySelectorAll('.pb-smenu').forEach(function(m){m.hidden=true});ROOT.querySelectorAll('[data-slot]').forEach(function(b){b.setAttribute('aria-expanded','false')})}
function rerender(){renderPhrase();renderRes()}
ROOT.addEventListener('click',function(e){
 var t=e.target.closest('[data-scn]');
 if(t){var s=SCN.filter(function(x){return x.id===t.getAttribute('data-scn')})[0];st.topic=s.s.topic||'any';st.place=s.s.place||'any';st.scn=s.id;st.note=!!s.note;touched=false;rerender();return}
 var o=e.target.closest('.pb-smenu [data-q]');
 if(o){
  var q=o.getAttribute('data-q'),v=o.getAttribute('data-v');
  $('#pb-err').hidden=true;
  if(q==='people'||q==='budget'){
   var ck=q==='people'?'pc':'bc';
   if(v==='custom'){if(st[q]==null)st[q]=300000;st[ck]=true;st.scn='';st.note=false;rerender();var inp=$(q==='people'?'#pb-in-n':'#pb-in-m');if(inp){inp.focus();inp.select()}return}
   st[ck]=false;st[q]=v==='any'?null:+v;st.scn='';st.note=false;rerender();return
  }
  st[q]=v;st.scn='';st.note=false;rerender();return
 }
 var b=e.target.closest('[data-slot]');
 if(b){var m=b.parentNode.querySelector('.pb-smenu'),was=m.hidden;closeAll();m.hidden=!was;b.setAttribute('aria-expanded',String(was));return}
 var ad=e.target.closest('[data-add]');
 if(ad){touched=true;if(ad.checked)selected[ad.getAttribute('data-add')]=1;else delete selected[ad.getAttribute('data-add')];renderForm();return}
 closeAll();
});
document.addEventListener('click',function(e){if(!ROOT.contains(e.target))closeAll()});
ROOT.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='pb-in-n'){if(setNum('people',t.value,100000))rerender()}
 if(t.id==='pb-in-m'){if(setNum('budget',t.value,1000000000))rerender()}
});
ROOT.addEventListener('input',function(e){
 var t=e.target;
 if(t.name==='contact'&&t.type==='tel'){t.value=formatPhone(t.value)}
});
ROOT.addEventListener('focusin',function(e){
 var t=e.target;
 if(t.name==='contact'&&t.type==='tel'&&!t.value.trim()){t.value='+7 (';try{t.setSelectionRange(4,4)}catch(x){}}
});
ROOT.addEventListener('keydown',function(e){
 if(e.key==='Escape')closeAll();
 if(e.key==='Enter'&&(e.target.id==='pb-in-n'||e.target.id==='pb-in-m')){e.preventDefault();e.target.dispatchEvent(new Event('change',{bubbles:true}))}
});
ROOT.addEventListener('submit',function(e){e.preventDefault();submit(e.target)});
window.__pb={st:st,search:search,phraseText:phraseText,render:rerender,selected:function(){return selected},endpoint:ENDPOINT};
rerender();
})();
</script>
</body>
