<head>

<meta name="viewport" content="width=device-width,initial-scale=1">

<style>
@font-face{font-family:TTCommonsPro;src:url(https://catalystrussia.ru/fonts/TT-Commons-Pro.woff) format('woff');font-display:swap}
:root{--g:#0aba59;--gh:#14cc67;--ink:#0a0a0a;--txt:#030303;--mut:#5f6368;--line:#e1e1e1;--card:#f2f4f9;--panel:#eff8ef;--ph:#e4e7ec;--tt:TTCommonsPro,Arial,sans-serif;--rb:Roboto,Arial,sans-serif}
*{box-sizing:border-box}
html,body{margin:0;padding:0}
body{font:400 17px/1.7 var(--rb);color:var(--txt);background:#fff}
button,input,select{font-family:inherit}
[hidden]{display:none!important}
.wrap{max-width:1280px;margin:0 auto;padding:0 24px}
.podbor{padding:48px 0}
.podbor h2{font:700 42px/1.14 var(--tt);color:var(--ink);margin:0;letter-spacing:-.4px}
.gr{color:var(--g)}
.sub{font:400 20px/1.4 var(--rb);color:var(--mut);max-width:750px;margin:12px 0 0}
.hd{margin-bottom:28px}
.btn{display:inline-flex;align-items:center;justify-content:center;min-height:52px;padding:0 28px;border-radius:35px;background:var(--g);color:#fff;font:700 18px/1.1 var(--tt);border:2px solid var(--g);cursor:pointer;text-decoration:none;text-align:center}
.btn:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.btn.alt{background:#fff;color:var(--ink);border-color:var(--ink)}
.btn.alt:hover{background:var(--ink);color:#fff}
.opt{display:inline-flex;align-items:center;justify-content:center;min-height:48px;padding:0 20px;border-radius:35px;border:1px solid var(--line);background:#fff;font:600 17px/1.1 var(--tt);color:var(--ink);cursor:pointer;text-align:center}
.opt:hover{border-color:var(--ink)}
.opt[aria-pressed="true"]{background:var(--g);border-color:var(--g);color:#fff}
.opt[aria-pressed="true"]:hover{background:var(--ink);border-color:var(--ink)}
.btn:focus-visible,.opt:focus-visible,a:focus-visible,input:focus-visible,select:focus-visible,button:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
.row{display:flex;flex-wrap:wrap;gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:24px}
.pcard{background:#fff;border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.ph{aspect-ratio:16/9;background:var(--ph);display:flex;align-items:center;justify-content:center;padding:12px;text-align:center}
.ph span{font:600 18px/1.2 var(--tt);color:var(--mut)}
.pbody{padding:18px 20px 20px;display:flex;flex-direction:column;gap:8px;flex:1}
.pbody h3{font:700 22px/1.2 var(--tt);color:var(--ink);margin:0;overflow-wrap:anywhere}
.meta{margin:0;font:400 16px/1.45 var(--rb);color:var(--mut)}
.near{margin:0;font:500 15px/1.35 var(--rb);color:#234438;background:var(--panel);border-left:3px solid var(--g);border-radius:0 10px 10px 0;padding:6px 10px}
.pact{margin-top:auto;padding-top:10px;display:flex;flex-direction:column;gap:10px}
.pact .btn{width:100%}
.more{font:700 18px/1.2 var(--tt);color:var(--g);text-decoration:none;text-align:center;min-height:30px}
.more:hover{color:var(--ink)}
.sum{margin:0 0 18px;font:400 18px/1.45 var(--rb);color:var(--mut)}
.sum b{font:700 20px/1.3 var(--tt);color:var(--ink);margin-right:8px}
.note{margin:0 0 18px;font:400 17px/1.45 var(--rb);color:#234438;background:var(--panel);border-left:3px solid var(--g);border-radius:0 10px 10px 0;padding:10px 14px}
.kp-ov{position:fixed;inset:0;background:rgba(10,10,10,.6);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px}
.kp{position:relative;background:#fff;border-radius:16px;width:100%;max-width:480px;max-height:100%;overflow:auto;padding:28px}
.kp h3{font:700 26px/1.2 var(--tt);color:var(--ink);margin:0 40px 6px 0}
.kp-prog{margin:0 0 18px;color:var(--mut);font-size:17px}
.kp label{display:block;font:500 16px/1.3 var(--rb);color:var(--mut);margin-bottom:14px}
.kp input{display:block;width:100%;min-height:48px;margin-top:6px;padding:0 14px;border:1px solid var(--line);border-radius:12px;font:400 17px var(--rb);color:var(--txt);background:#fff}
.kp-err{color:#b3261e;margin:0 0 10px;min-height:0;font-size:16px}
.kp form .btn{width:100%}
.kp-ok{font:500 19px/1.4 var(--rb);color:var(--ink);margin:0}
.kp-x{position:absolute;top:12px;right:12px;width:48px;height:48px;border-radius:50%;border:1px solid var(--line);background:#fff;font-size:26px;line-height:1;cursor:pointer;color:var(--ink)}
.kp-x:hover{background:var(--ink);color:#fff}
@media(max-width:900px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:640px){.wrap{padding:0 16px}.podbor{padding:32px 0}.podbor h2{font-size:30px}.sub{font-size:18px}.grid3{grid-template-columns:1fr;gap:16px}.sum b{display:block;margin:0 0 4px}}


.pills{margin-bottom:28px}
.phrase{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:36px 32px;margin-bottom:32px;font:700 40px/1.9 var(--tt);color:var(--ink);letter-spacing:-.4px}
.slot{position:relative;display:inline-block}
.sbtn{font:inherit;letter-spacing:inherit;color:var(--g);background:#fff;border:2px solid var(--g);border-radius:14px;padding:0 14px;line-height:1.5;cursor:pointer;display:inline-flex;align-items:center;gap:10px;vertical-align:baseline}
.sbtn:hover{background:var(--ink);border-color:var(--ink);color:#fff}
.sbtn i{width:10px;height:10px;border-right:3px solid currentColor;border-bottom:3px solid currentColor;transform:rotate(45deg) translateY(-3px)}
.smenu{position:absolute;left:0;top:calc(100% + 6px);z-index:20;margin:0;padding:8px;list-style:none;background:#fff;border:1px solid var(--line);border-radius:16px;min-width:240px;font:600 19px/1.2 var(--tt)}
.smenu button{width:100%;text-align:left;min-height:48px;padding:0 14px;border:0;border-radius:10px;background:transparent;font:inherit;color:var(--ink);cursor:pointer}
.smenu button:hover{background:var(--ink);color:#fff}
.smenu button[aria-selected="true"]{color:var(--g)}
.smenu button[aria-selected="true"]:hover{color:#fff}
@media(max-width:900px){.phrase{font-size:30px}}
@media(max-width:640px){.phrase{font-size:23px;padding:20px 16px;line-height:2}.smenu{min-width:200px;font-size:17px}.slot{display:inline}.smenu{left:0}}

.phrase{font:700 34px/2.1 var(--tt)}
.inp{font:inherit;letter-spacing:inherit;color:var(--g);background:#fff;border:2px solid var(--g);border-radius:14px;padding:0 10px;line-height:1.5;text-align:center;vertical-align:baseline;max-width:100%}
.inp.n{width:3.2em}.inp.m{width:5.6em}
.inp:focus-visible{outline:2px solid var(--ink);outline-offset:2px}

.quick span{font:600 17px/1.2 var(--tt);color:var(--mut);min-width:90px}
.quick .opt{min-height:44px;padding:0 16px;font-size:16px}
.err{color:#b3261e;font-size:16px;margin:0 0 14px}
.sechd{font:700 30px/1.2 var(--tt);color:var(--ink);margin:40px 0 8px}
.chk{display:flex;align-items:center;gap:10px;min-height:48px;font:600 17px/1.2 var(--tt);color:var(--ink);cursor:pointer;margin-top:auto}
.chk input{width:24px;height:24px;accent-color:var(--g);flex:none;cursor:pointer}
.tot{margin:0;font:700 19px/1.3 var(--tt);color:var(--ink)}
.tot.no{font:500 16px/1.4 var(--rb);color:var(--mut)}
.grp{font:700 22px/1.2 var(--tt);color:var(--ink);margin:28px 0 14px}
.ph{aspect-ratio:21/9}
.form{border:1px solid var(--line);border-radius:16px;background:var(--card);padding:32px;margin-top:48px}
.form h3{font:700 30px/1.2 var(--tt);color:var(--ink);margin:0 0 16px}
.fgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}
.fgrid label,.form .full{display:block;font:500 16px/1.3 var(--rb);color:var(--mut)}
.fgrid .full,.full{grid-column:1/-1}
.form input[type=text],.form input[type=tel],.form input[type=date],.form select,.form textarea{display:block;width:100%;min-height:48px;margin-top:6px;padding:10px 14px;border:1px solid var(--line);border-radius:12px;font:400 17px var(--rb);color:var(--txt);background:#fff}
.form textarea{min-height:96px;resize:vertical}
.auto{background:#fff;border:1px solid var(--line);border-radius:12px;padding:14px 18px;margin:0 0 16px}
.auto p{margin:0 0 6px;font:500 17px/1.4 var(--rb);color:var(--ink)}
.auto ul{margin:6px 0 0;padding-left:22px;font:400 16px/1.5 var(--rb);color:var(--txt)}
.auto b{font:700 16px var(--tt);color:var(--mut)}
.form .btn{margin-top:8px;width:100%;max-width:360px}
.done{border:1px solid var(--g);background:var(--panel);border-radius:16px;padding:32px;margin-top:48px}
.done h3{font:700 30px/1.2 var(--tt);color:var(--ink);margin:0 0 8px}
.done p{margin:0;font:400 18px/1.45 var(--rb)}
@media(max-width:900px){.phrase{font-size:27px}}
@media(max-width:640px){.phrase{font-size:21px;padding:18px 12px;line-height:2.2}.fgrid{grid-template-columns:1fr}.form,.done{padding:20px 16px}.quick span{min-width:100%}.sechd{font-size:25px}}
</style>
</head>

var ADJ=[{id:'any',label:'любой'},{id:'sport',label:'спортивный'},{id:'tvorch',label:'творческий'},{id:'biz',label:'бизнес-игра'},{id:'cook',label:'кулинарный'},{id:'neuro',label:'с нейросетями'},{id:'ny',label:'новогодний'},{id:'zima',label:'зимний'},{id:'leto',label:'летний'}];
var WH=[{id:'any',label:'в любом месте'},{id:'room',label:'в помещении'},{id:'street',label:'на улице'},{id:'trip',label:'на выезде'}];
var PEOPLE_Q=[30,50,100,200,500],BUDGET_Q=[150000,300000,500000,1000000];
var SCN=[
{id:'trip',label:'Выезд за город',s:{place:'trip'}},
{id:'venue',label:'Подобрать площадку',s:{},note:true},
{id:'ny',label:'Новый год',s:{topic:'ny'}},
{id:'zima',label:'Зимний тимбилдинг',s:{topic:'zima'}},
{id:'leto',label:'Летний на природе',s:{topic:'leto',place:'street'}},
{id:'room',label:'В офисе или зале',s:{place:'room'}},
{id:'sport',label:'Спортивный',s:{topic:'sport'}},
{id:'tvorch',label:'Творческий',s:{topic:'tvorch'}}
];
var st={topic:'any',place:'any',people:100,budget:300000,scn:'',note:false};
var selected={},touched=false,lastList=[];
function esc(s){return String(s).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]})}
function money(n){return String(Math.round(n)).replace(/\B(?=(\d{3})+(?!\d))/g,' ')}
function k(n){return money(Math.round(n/1000)*1000)}
function lab(l,id){var o=l.filter(function(x){return x.id===id})[0];return o?o.label:''}
function low(s){return String(s||'').toLowerCase()}
function range(p){var m=/^(\d+)-(\d+)$/.exec(p.lyudi||'');return m?[+m[1],+m[2]]:null}
function total(p,n){if(p.cena==null||!p.cena_za)return null;if(p.cena_za==='за гостя')return p.cena*n;if(p.cena_za==='за программу')return p.cena;return null}
function topicOk(p,t){
 if(t==='any')return true;
 var f=low(p.format),s=low(p.sezon);
 if(t==='sport')return f.indexOf('спорт')>-1;
 if(t==='tvorch')return f.indexOf('творчество')>-1;
 if(t==='biz')return f.indexOf('бизнес-игра')>-1;
 if(t==='cook')return f.indexOf('кулинария')>-1;
 if(t==='neuro')return f.indexOf('нейросети')>-1;
 var key={ny:'новый год',zima:'зима',leto:'лето'}[t];
 if(s.indexOf(key)>-1||s.indexOf('круглый')>-1)return true;
 if(!s){return !((t==='ny'||t==='zima')&&p.mesto==='улица')}
 return false
}
function placeOk(p,pl){
 if(pl==='any')return true;
 if(pl==='trip')return p.vyezd==='да';
 if(pl==='room')return p.mesto==='помещение'||p.mesto==='оба'||p.ofis==='да';
 if(pl==='street')return p.mesto==='улица'||p.mesto==='оба';
 return true
}
function search(){
 var n=st.people,B=st.budget;
 var rows=PROGRAMS.map(function(p){
  var un=[],r=range(p),tot=total(p,n),w=0;
  if(!topicOk(p,st.topic)){un.push((st.topic==='ny'||st.topic==='zima'||st.topic==='leto')?'другой сезон':'другой формат');w+=4}
  if(!placeOk(p,st.place)){un.push('другое место');w+=3}
  if(r){
   if(n<r[0]){un.push('рассчитана на группы от '+r[0]);w+=2+(r[0]-n)/1000}
   else if(n>r[1]){un.push('рассчитана на группы до '+r[1]);w+=2+(n-r[1])/1000}
  }
  if(tot!=null&&tot>B){
   un.push(tot<=B*1.3?'чуть выше бюджета':'выше бюджета на '+k(tot-B)+' ₽');
   w+=1+(tot-B)/B
  }
  return {p:p,un:un,w:w,tot:tot,ok:!un.length}
 });
 var exact=rows.filter(function(r){return r.ok});
 exact.sort(function(a,b){
  if(a.tot==null&&b.tot==null)return a.p.name.localeCompare(b.p.name,'ru');
  if(a.tot==null)return 1;if(b.tot==null)return -1;
  return a.tot-b.tot||a.p.name.localeCompare(b.p.name,'ru')});
 var near=rows.filter(function(r){return !r.ok&&(r.tot!=null||true)});
 near.sort(function(a,b){return a.w-b.w||a.p.name.localeCompare(b.p.name,'ru')});
 var need=Math.max(0,6-exact.length);
 if(!exact.length)need=6;
 return {exact:exact,near:near.slice(0,need)}
}
function metaText(p){var a=[],r=range(p);if(r)a.push(r[0]+' до '+r[1]+' человек');else a.push('число участников уточним в заявке');if(p.vremya)a.push(p.vremya);return a.join(' · ')}
function cardHTML(r){
 var p=r.p,sl=esc(p.slug);
 var price=r.tot!=null?'<p class="tot">≈ '+k(r.tot)+' ₽ на вашу группу</p>':'<p class="tot no">цену посчитаем в заявке</p>';
 var near=r.un.length?'<p class="near">Ближайшее: '+esc(r.un.join(', '))+'</p>':'';
 return '<article class="pcard" data-pcard="'+sl+'"><div class="ph" role="img" aria-label="Фото: '+esc(p.name)+'"><span>'+esc(p.name)+'</span></div><div class="pbody"><h3>'+esc(p.name)+'</h3><p class="meta">'+esc(metaText(p))+'</p>'+price+near+'<a class="more" href="'+BASE+sl+'/" target="_blank" rel="noopener">О программе →</a><label class="chk"><input type="checkbox" data-add="'+sl+'"'+(selected[p.slug]?' checked':'')+'>Добавить в заявку</label></div></article>'
}
function slot(q,list){
 var cur=list.filter(function(o){return o.id===st[q]})[0]||list[0];
 return '<span class="slot"><button type="button" class="sbtn" data-slot="'+q+'" aria-haspopup="listbox" aria-expanded="false">'+esc(cur.label)+'<i aria-hidden="true"></i></button><ul class="smenu" role="listbox" hidden>'+list.map(function(o){return '<li><button type="button" role="option" aria-selected="'+(o.id===cur.id)+'" data-q="'+q+'" data-v="'+o.id+'">'+esc(o.label)+'</button></li>'}).join('')+'</ul></span>'
}
function phraseText(){
 return 'Нужен '+lab(ADJ,st.topic)+' тимбилдинг '+lab(WH,st.place)+' на '+st.people+' человек, бюджет до '+money(st.budget)+' ₽ всего'
}
function renderPhrase(){
 $('#pills').innerHTML=SCN.map(function(s){return '<button type="button" class="opt" data-scn="'+s.id+'" aria-pressed="'+(st.scn===s.id)+'">'+esc(s.label)+'</button>'}).join('');
 $('#phrase').innerHTML='Нужен '+slot('topic',ADJ)+' тимбилдинг '+slot('place',WH)+' на <input class="inp n" id="in-n" type="text" inputmode="numeric" autocomplete="off" aria-label="Число человек" value="'+st.people+'"> человек, бюджет до <input class="inp m" id="in-m" type="text" inputmode="numeric" autocomplete="off" aria-label="Общий бюджет, рублей" value="'+money(st.budget)+'"> ₽ всего';
 $('#quick').innerHTML='<div class="quick"><span>Человек</span>'+PEOPLE_Q.map(function(v){return '<button type="button" class="opt" data-qp="'+v+'" aria-pressed="'+(st.people===v)+'">'+v+'</button>'}).join('')+'</div><div class="quick"><span>Бюджет</span>'+BUDGET_Q.map(function(v){return '<button type="button" class="opt" data-qb="'+v+'" aria-pressed="'+(st.budget===v)+'">'+money(v)+' ₽</button>'}).join('')+'</div>'
}
function renderRes(){
 var r=search(),list=r.exact.concat(r.near);
 lastList=list;
 var vis={};list.forEach(function(x){vis[x.p.slug]=1});
 if(!touched){selected={};list.slice(0,3).forEach(function(x){selected[x.p.slug]=1})}
 else{Object.keys(selected).forEach(function(s){if(!vis[s])delete selected[s]})}
 var h='<h3 class="sechd">Что можем предложить</h3><p class="sum"><b>'+(r.exact.length?('Вписались в бюджет и по людям: '+r.exact.length):'Точных совпадений нет, показываем ближайшие')+'</b><span>итог считаем на '+st.people+' человек, бюджет '+money(st.budget)+' ₽ всего</span></p>';
 if(st.note)h+='<p class="note">Площадку подберём под выбранную программу: напишите пожелания в заявке.</p>';
 if(r.exact.length)h+='<div class="grid3">'+r.exact.map(cardHTML).join('')+'</div>';
 if(r.near.length)h+=(r.exact.length?'<h4 class="grp">Ближайшие по условиям</h4>':'')+'<div class="grid3">'+r.near.map(cardHTML).join('')+'</div>';
 $('#res').innerHTML=h;
 renderForm()
}
function chosen(){return lastList.filter(function(x){return selected[x.p.slug]})}
var sent=false,fdata={};
function autoHTML(){
 var c=chosen();
 return '<div class="auto" id="auto"><p><b>Ваш запрос.</b> '+esc(phraseText())+'</p><p><b>Программы в заявке:</b> '+(c.length?c.length:'не выбраны')+'</p>'+(c.length?'<ul>'+c.map(function(x){return '<li>'+esc(x.p.name)+(x.tot!=null?', ≈ '+k(x.tot)+' ₽':', цену посчитаем в заявке')+'</li>'}).join('')+'</ul>':'<p>Отметьте программы в карточках или отправьте заявку, мы подберём сами.</p>')+'</div>'
}
function renderForm(){
 var box=$('#formbox');
 if(sent)return;
 var f=box.querySelector('form');
 if(f){var a=box.querySelector('#auto');if(a)a.outerHTML=autoHTML();return}
 box.innerHTML='<div class="form"><h3>Оставить заявку</h3>'+autoHTML()+'<form novalidate><div class="fgrid"><label>Имя<input type="text" name="name" autocomplete="name"></label><label>Телефон<input type="tel" name="phone" autocomplete="tel" inputmode="tel"></label><label>Куда написать<select name="messenger"><option>Telegram</option><option>Max</option></select></label><label>Дата мероприятия, если известна<input type="date" name="date"></label><label class="full">Комментарий<textarea name="comment"></textarea></label></div><p class="err" id="ferr" hidden></p><button class="btn" type="submit">Отправить заявку</button></form></div>'
}
function submit(form){
 var F=form.elements,name=F.name.value.trim(),phone=F.phone.value.trim(),e=$('#ferr');
 if(!name){e.textContent='Укажите имя';e.hidden=false;return}
 if(phone.replace(/\D/g,'').length<10){e.textContent='Укажите телефон полностью';e.hidden=false;return}
 var c=chosen();
 var req={phrase:phraseText(),filters:{topic:lab(ADJ,st.topic),place:lab(WH,st.place),people:st.people,budget_total:st.budget},programs:c.map(function(x){return {slug:x.p.slug,name:x.p.name,estimate_rub:x.tot!=null?Math.round(x.tot/1000)*1000:null}}),contact:{name:name,phone:phone,messenger:F.messenger.value,date:F.date.value||null,comment:F.comment.value.trim()}};
 console.log(JSON.stringify(req,null,2));
 window.__lastRequest=req;sent=true;
 $('#formbox').innerHTML='<div class="done" role="status"><h3>Заявка принята, пришлём КП за 10 минут</h3><p>'+esc(phraseText())+'</p></div>'
}
function parseNum(s){var v=parseInt(String(s).replace(/\D/g,''),10);return isNaN(v)?null:v}
function setNum(key,raw,max){
 var v=parseNum(raw),e=$('#err');
 if(v==null||v<1||v>max){e.textContent=key==='people'?'Укажите число человек от 1 до '+max:'Укажите бюджет числом, например 300 000';e.hidden=false;return false}
 e.hidden=true;st[key]=v;st.scn='';st.note=false;return true
}
function closeAll(){document.querySelectorAll('.smenu').forEach(function(m){m.hidden=true});document.querySelectorAll('.sbtn').forEach(function(b){b.setAttribute('aria-expanded','false')})}
document.addEventListener('click',function(e){
 var t=e.target.closest('[data-scn]');
 if(t){var s=SCN.filter(function(x){return x.id===t.getAttribute('data-scn')})[0];st.topic=s.s.topic||'any';st.place=s.s.place||'any';st.scn=s.id;st.note=!!s.note;touched=false;renderPhrase();renderRes();return}
 var o=e.target.closest('.smenu [data-q]');
 if(o){st[o.getAttribute('data-q')]=o.getAttribute('data-v');st.scn='';st.note=false;renderPhrase();renderRes();return}
 var b=e.target.closest('.sbtn');
 if(b){var m=b.nextElementSibling,was=m.hidden;closeAll();m.hidden=!was;b.setAttribute('aria-expanded',String(was));return}
 var qp=e.target.closest('[data-qp]');
 if(qp){$('#err').hidden=true;st.people=+qp.getAttribute('data-qp');st.scn='';st.note=false;renderPhrase();renderRes();return}
 var qb=e.target.closest('[data-qb]');
 if(qb){$('#err').hidden=true;st.budget=+qb.getAttribute('data-qb');st.scn='';st.note=false;renderPhrase();renderRes();return}
 var ad=e.target.closest('[data-add]');
 if(ad){touched=true;if(ad.checked)selected[ad.getAttribute('data-add')]=1;else delete selected[ad.getAttribute('data-add')];renderForm();return}
 closeAll();
});
document.addEventListener('change',function(e){
 var t=e.target;
 if(t.id==='in-n'){if(setNum('people',t.value,100000)){renderPhrase();renderRes()}}
 if(t.id==='in-m'){if(setNum('budget',t.value,1000000000)){renderPhrase();renderRes()}}
});
document.addEventListener('keydown',function(e){
 if(e.key==='Escape')closeAll();
 if(e.key==='Enter'&&(e.target.id==='in-n'||e.target.id==='in-m')){e.preventDefault();e.target.blur();e.target.dispatchEvent(new Event('change',{bubbles:true}))}
});
document.addEventListener('submit',function(e){e.preventDefault();submit(e.target)});
window.PB10={st:st,search:search,phraseText:phraseText,render:function(){renderPhrase();renderRes()},selected:function(){return selected}};
renderPhrase();renderRes();
})();
</script>
</body>
</html>
