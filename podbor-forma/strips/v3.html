<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Подбор тимбилдинга: вариант 3</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap&subset=cyrillic"><link rel="stylesheet" href="zb-base.css"><style>.zb-v3{--K3:21.1;--K1:60.78}
.zb-v3{--pd:48px;--pt:44px;--pb:48px;--xb:0px;--lh:2.3}
.zb-v3 .zb-card{background:#0a0a0a;border-radius:28px}
.zb-v3 .zb-h2{color:#fff}
.zb-v3 .zb-sub{color:#b9bcc1}
.zb-v3 .zb-hd{margin-bottom:28px}
.zb-v3 .zb-phrase{color:#fff}
.zb-v3 .zb-f{border:.07em solid var(--g);border-radius:999px;background:transparent;color:#fff}
.zb-v3 .zb-ar{color:var(--g);padding-right:.2em}
.zb-v3 .zb-f:hover,.zb-v3 .zb-cu:focus-within{background:#fff;border-color:#fff;color:var(--ink)}
.zb-v3 .zb-f:focus-visible,.zb-v3 .zb-cu:focus-within{outline-color:#fff}
.zb-v3 .zb-actions{margin-top:34px}
.zb-v3 .zb-go:hover{background:#fff;border-color:#fff;color:var(--ink)}
@media(max-width:640px){.zb-v3{--pd:16px;--pt:26px;--pb:26px}.zb-v3 .zb-card{border-radius:22px}.zb-v3 .zb-actions{margin-top:26px}}
.zb-v3{--fh:1.7em;--px:0.65em;--arw:1.6em}@media(max-width:640px){.zb-v3{--fh:1.95em;--px:0.45em;--arw:1.28em}}</style></head><body>
<section class="zb zb-v3" id="zb" aria-label="Подбор тимбилдинга"><div class="zb-card"><div class="zb-hd"><h2 class="zb-h2">Подберём тимбилдинг под <em>вашу группу</em></h2><p class="zb-sub">Нажмите на любое поле со стрелкой и выберите своё значение.</p></div>
<p class="zb-phrase" id="zb-phrase"></p>
<div class="zb-actions"><a class="zb-go" id="zb-go" href="#">Подобрать</a></div></div></section>
<p class="zb-link" id="zb-link">Превью: кнопка «Подобрать» не уходит на сайт, а показывает ссылку. Нажмите её, и здесь появится адрес с четырьмя параметрами.</p>
<script>window.ZB_PREVIEW=true</script><script src="zb.js"></script></body></html>
