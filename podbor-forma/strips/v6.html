<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Подбор тимбилдинга: вариант 6</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap&subset=cyrillic"><link rel="stylesheet" href="zb-base.css"><style>.zb-v6{--K3:19.71;--K1:57.12}
.zb-v6{--pd:40px;--pt:44px;--pb:48px;--xb:0px;--lh:2.35}
.zb-v6 .zb-card{background:#f3f3ee;border-radius:28px;text-align:center}
.zb-v6 .zb-sub{margin-left:auto;margin-right:auto}
.zb-v6 .zb-hd{margin-bottom:28px}
.zb-v6 .zb-phrase{text-align:center}
.zb-v6 .zb-f{border:.07em solid var(--g);border-bottom-width:.2em;border-radius:.4em;background:#fff;color:var(--g)}
.zb-v6 .zb-f:hover,.zb-v6 .zb-cu:focus-within{background:var(--g);color:#fff}
.zb-v6 .zb-actions{display:flex;justify-content:center;margin-top:36px}
@media(max-width:640px){.zb-v6{--pd:16px;--pt:26px;--pb:26px}.zb-v6 .zb-card{border-radius:22px}.zb-v6 .zb-actions{margin-top:26px}}
.zb-v6{--fh:1.65em;--px:0.5em;--arw:1.0em}@media(max-width:640px){.zb-v6{--fh:1.95em;--px:0.35em;--arw:0.80em}}</style></head><body>
<section class="zb zb-v6" id="zb" aria-label="Подбор тимбилдинга"><div class="zb-card"><div class="zb-hd"><h2 class="zb-h2">Подберём <em>тимбилдинг</em></h2><p class="zb-sub">Нажмите на поле с зелёной гранью и выберите значение.</p></div>
<p class="zb-phrase" id="zb-phrase"></p>
<div class="zb-actions"><a class="zb-go" id="zb-go" href="#">Подобрать</a></div></div></section>
<p class="zb-link" id="zb-link">Превью: кнопка «Подобрать» не уходит на сайт, а показывает ссылку. Нажмите её, и здесь появится адрес с четырьмя параметрами.</p>
<script>window.ZB_PREVIEW=true</script><script src="zb.js"></script></body></html>
