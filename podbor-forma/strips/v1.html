<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Подбор тимбилдинга: вариант 1</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap&subset=cyrillic"><link rel="stylesheet" href="zb-base.css"><style>.zb-v1{--K3:18.13;--K1:53.09}
.zb-v1{--pd:48px;--pt:44px;--pb:48px;--xb:2px;--lh:2.15}
.zb-v1 .zb-card{background:#fff;border:1px solid var(--line);border-radius:24px}
.zb-v1 .zb-hd{margin-bottom:28px}
.zb-v1 .zb-f{border-width:0 0 .08em;border-color:var(--g);border-radius:0;background:transparent;color:var(--g)}
.zb-v1 .zb-f:hover,.zb-v1 .zb-cu:focus-within{background:#e3f7ea}
.zb-v1 .zb-actions{margin-top:34px}
@media(max-width:640px){.zb-v1{--pd:16px;--pt:26px;--pb:26px}.zb-v1 .zb-card{border-radius:20px}.zb-v1 .zb-actions{margin-top:26px}}
.zb-v1{--fh:1.55em;--px:0.12em;--arw:0.85em}@media(max-width:640px){.zb-v1{--fh:1.95em;--px:0.08em;--arw:0.68em}}</style></head><body>
<section class="zb zb-v1" id="zb" aria-label="Подбор тимбилдинга"><div class="zb-card"><div class="zb-hd"><h2 class="zb-h2">Подберём <em>тимбилдинг</em></h2><p class="zb-sub">Нажмите на зелёное слово, выберите своё и жмите «Подобрать».</p></div>
<p class="zb-phrase" id="zb-phrase"></p>
<div class="zb-actions"><a class="zb-go" id="zb-go" href="#">Подобрать</a></div></div></section>
<p class="zb-link" id="zb-link">Превью: кнопка «Подобрать» не уходит на сайт, а показывает ссылку. Нажмите её, и здесь появится адрес с четырьмя параметрами.</p>
<script>window.ZB_PREVIEW=true</script><script src="zb.js"></script></body></html>
