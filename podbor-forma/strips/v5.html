<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Подбор тимбилдинга: вариант 5</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap&subset=cyrillic"><link rel="stylesheet" href="zb-base.css"><style>.zb-v5{--K3:19.79;--K1:57.61}
.zb-v5{--pd:44px;--xb:4px;--lh:2.3}
.zb-v5 .zb-card{padding:0;background:#fff;border:2px solid var(--ink);border-radius:22px}
.zb-v5 .zb-band{display:flex;align-items:baseline;justify-content:space-between;gap:16px;background:var(--ink);padding:20px var(--pd);border-radius:18px 18px 0 0}
.zb-v5 .zb-band .zb-h2{font-size:32px;color:#fff}
.zb-v5 .zb-band p{font:400 18px/1.3 Roboto,Arial,sans-serif;color:#b9bcc1}
.zb-v5 .zb-body{padding:34px var(--pd) 40px}
.zb-v5 .zb-f{border-width:0 0 .08em;border-color:var(--ink);border-radius:.3em .3em 0 0;background:#f2f4f9;color:var(--ink)}
.zb-v5 .zb-f:hover,.zb-v5 .zb-cu:focus-within{background:#e3f7ea;border-color:var(--g);color:var(--ink)}
.zb-v5 .zb-f:hover .zb-ar,.zb-v5 .zb-cu:focus-within .zb-ar{color:var(--g)}
.zb-v5 .zb-go{display:flex;width:100%;min-height:68px;margin-top:34px;font-size:22px}
@media(max-width:640px){.zb-v5{--pd:16px}.zb-v5 .zb-card{border-radius:20px}.zb-v5 .zb-band{padding:16px var(--pd);border-radius:16px 16px 0 0}.zb-v5 .zb-band p{display:none}.zb-v5 .zb-band .zb-h2{font-size:26px}.zb-v5 .zb-body{padding:24px var(--pd) 22px}.zb-v5 .zb-go{margin-top:26px;min-height:60px;font-size:20px}}
.zb-v5{--fh:1.7em;--px:0.5em;--arw:1.2em}@media(max-width:640px){.zb-v5{--fh:1.95em;--px:0.35em;--arw:0.96em}}</style></head><body>
<section class="zb zb-v5" id="zb" aria-label="Подбор тимбилдинга"><div class="zb-card"><div class="zb-band"><h2 class="zb-h2">Подберём <em>тимбилдинг</em></h2><p>Выберите значения в списках</p></div>
<div class="zb-body"><p class="zb-phrase" id="zb-phrase"></p>
<a class="zb-go" id="zb-go" href="#">Подобрать</a></div></div></section>
<p class="zb-link" id="zb-link">Превью: кнопка «Подобрать» не уходит на сайт, а показывает ссылку. Нажмите её, и здесь появится адрес с четырьмя параметрами.</p>
<script>window.ZB_PREVIEW=true</script><script src="zb.js"></script></body></html>
