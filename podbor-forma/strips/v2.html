<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Подбор тимбилдинга: вариант 2</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap&subset=cyrillic"><link rel="stylesheet" href="zb-base.css"><style>.zb-v2{--K3:20.54;--K1:59.14}
.zb-v2{--pd:44px;--pt:40px;--pb:36px;--xb:0px;--lh:2.3}
.zb-v2 .zb-card{background:#f4f5f7;border-radius:24px}
.zb-v2 .zb-hd{margin-bottom:26px}
.zb-v2 .zb-f{border:.07em solid var(--ink);border-radius:.4em;background:#fff;color:var(--ink);overflow:hidden}
.zb-v2 .zb-ar{border-left:.07em solid var(--ink);background:#e3f7ea;color:var(--ink)}
.zb-v2 .zb-f:hover,.zb-v2 .zb-cu:focus-within{border-color:var(--g)}
.zb-v2 .zb-f:hover .zb-ar,.zb-v2 .zb-cu:focus-within .zb-ar{background:var(--g);border-left-color:var(--g);color:#fff}
.zb-v2 .zb-actions{display:flex;align-items:center;justify-content:space-between;gap:24px;margin-top:30px}
.zb-v2 .zb-note{font:400 18px/1.4 Roboto,Arial,sans-serif;color:var(--mut)}
@media(max-width:640px){.zb-v2{--pd:16px;--pt:24px;--pb:20px}.zb-v2 .zb-card{border-radius:20px}.zb-v2 .zb-actions{flex-direction:column;align-items:stretch;gap:14px;margin-top:22px}.zb-v2 .zb-note{font-size:16px}}
.zb-v2{--fh:1.75em;--px:0.5em;--arw:1.5em}@media(max-width:640px){.zb-v2{--fh:1.95em;--px:0.35em;--arw:1.20em}}</style></head><body>
<section class="zb zb-v2" id="zb" aria-label="Подбор тимбилдинга"><div class="zb-card"><div class="zb-hd"><h2 class="zb-h2">Подберём <em>тимбилдинг</em></h2><p class="zb-sub">Выберите в списках, что нужно.</p></div>
<p class="zb-phrase" id="zb-phrase"></p>
<div class="zb-actions"><p class="zb-note">Покажем подходящие программы с ценой на вашу группу</p><a class="zb-go" id="zb-go" href="#">Подобрать</a></div></div></section>
<p class="zb-link" id="zb-link">Превью: кнопка «Подобрать» не уходит на сайт, а показывает ссылку. Нажмите её, и здесь появится адрес с четырьмя параметрами.</p>
<script>window.ZB_PREVIEW=true</script><script src="zb.js"></script></body></html>
