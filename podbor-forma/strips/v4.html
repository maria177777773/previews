<!doctype html>
<html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><title>Подбор тимбилдинга: вариант 4</title><link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;500;700&display=swap&subset=cyrillic"><link rel="stylesheet" href="zb-base.css"><style>.zb-v4{--K3:21.36;--K1:59.86}
.zb-v4{--pd:40px;--pt:34px;--pb:38px;--xb:0px;--xe:252px;--lh:2.3}
.zb-v4 .zb-card{background:#e3f7ea;border-radius:24px}
.zb-v4 .zb-h2{font-size:34px}
.zb-v4 .zb-hd{margin-bottom:22px}
.zb-v4 .zb-sub{font-size:19px;margin-top:6px}
.zb-v4 .zb-f{border:.07em solid var(--g);border-radius:999px;background:#fff;color:var(--ink);padding-right:.16em}
.zb-v4 .zb-ar{width:1.3em;height:1.3em;align-self:center;border-radius:50%;background:var(--g);color:#fff;flex:none}
.zb-v4 .zb-f:hover .zb-ar,.zb-v4 .zb-cu:focus-within .zb-ar{background:var(--ink)}
.zb-v4 .zb-go{background:var(--ink);border-color:var(--ink)}
.zb-v4 .zb-go:hover{background:var(--g);border-color:var(--g)}
.zb-v4 .zb-row{display:block}
.zb-v4 .zb-actions{margin-top:28px}
@container (min-width:1100px){.zb-v4 .zb-row{display:flex;align-items:center;gap:32px}.zb-v4 .zb-phrase{flex:1 1 auto;min-width:0}.zb-v4 .zb-actions{margin:0;flex:none}.zb-v4 .zb-go{width:220px;min-width:0}}
@media(max-width:640px){.zb-v4{--pd:16px;--pt:24px;--pb:24px}.zb-v4 .zb-card{border-radius:20px}.zb-v4 .zb-h2{font-size:28px}.zb-v4 .zb-actions{margin-top:22px}}
.zb-v4{--fh:1.7em;--px:0.6em;--arw:1.35em}@media(max-width:640px){.zb-v4{--fh:1.95em;--px:0.42em;--arw:1.08em}}</style></head><body>
<section class="zb zb-v4" id="zb" aria-label="Подбор тимбилдинга"><div class="zb-card"><div class="zb-hd"><h2 class="zb-h2">Подберём <em>тимбилдинг</em></h2><p class="zb-sub">Соберите запрос из четырёх слов, остальное мы подберём сами.</p></div>
<div class="zb-row"><p class="zb-phrase" id="zb-phrase"></p>
<div class="zb-actions"><a class="zb-go" id="zb-go" href="#">Подобрать</a></div></div></div></section>
<p class="zb-link" id="zb-link">Превью: кнопка «Подобрать» не уходит на сайт, а показывает ссылку. Нажмите её, и здесь появится адрес с четырьмя параметрами.</p>
<script>window.ZB_PREVIEW=true</script><script src="zb.js"></script></body></html>
