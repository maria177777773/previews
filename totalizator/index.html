<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex">
<title>Тотализатор баннеров · Каталист</title>
<link rel="icon" href="assets/logo.png" type="image/png">
<style>
@font-face{font-family:TT;src:url(assets/TT_Commons_Pro_Bold.woff2) format("woff2");font-weight:700;font-display:swap}
@font-face{font-family:TT;src:url(assets/TT_Commons_Pro_ExtraBold.woff2) format("woff2");font-weight:800;font-display:swap}
@font-face{font-family:Roboto;src:url(assets/roboto-cyrillic.woff2) format("woff2");font-weight:400 700;font-display:swap;unicode-range:U+400-45F,U+2116}
@font-face{font-family:Roboto;src:url(assets/roboto-latin.woff2) format("woff2");font-weight:400 700;font-display:swap;unicode-range:U+0-FF,U+2000-206F,U+2190-21FF}
:root{
  --g:#0aba59;--gd:#08964a;--gl:#e3f6eb;--k:#111;--m:#5f625e;--l:#e3e6e1;--bg:#f3f5f2;--r:#c9302a;--rl:#fdecea;
  --btn-h:52px;--fs:18px;--fs-s:16px;--fs-l:22px;--fs-h1:52px;--fs-h2:34px;--fs-place:26px;
  --gap:16px;--rad:22px;--pad:12px;
}
@media (max-width:820px){:root{--fs:16px;--fs-s:16px;--fs-l:19px;--fs-h1:34px;--fs-h2:26px;--fs-place:22px;--gap:14px;--rad:18px;--pad:12px;--btn-h:50px}}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;font:400 var(--fs)/1.45 Roboto,Arial,sans-serif;color:var(--k);background:var(--bg)}
h1,h2,h3{font-family:TT,Roboto,sans-serif;font-weight:800;line-height:1.08;margin:0}
h1{font-size:var(--fs-h1)}h2{font-size:var(--fs-h2)}h3{font-size:var(--fs-l)}
.wrap{max-width:1400px;margin:0 auto;padding:0 24px}
@media (max-width:820px){.wrap{padding:0 16px}}
button{font:inherit;font-weight:700;min-height:var(--btn-h);padding:0 26px;border-radius:999px;border:2px solid var(--g);background:var(--g);color:#fff;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px;line-height:1.1;text-align:center}
button:hover{background:var(--gd);border-color:var(--gd)}
button.lt{background:#fff;color:var(--k);border-color:var(--l)}
button.lt:hover{border-color:var(--k)}
button:disabled{opacity:.35;cursor:default}
button.lt:disabled:hover{border-color:var(--l)}
button:disabled:hover{background:var(--g);border-color:var(--g)}
button.lt:disabled:hover{background:#fff}
button:focus-visible,input:focus-visible,.ph:focus-visible{outline:3px solid var(--k);outline-offset:3px}

/* шапка */
header.top{background:#fff;border-bottom:1px solid var(--l)}
.top .wrap{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:76px}
.brand{display:flex;align-items:center;gap:12px;font:800 var(--fs-l) TT,Roboto,sans-serif}
.brand img{width:48px;height:48px;border-radius:50%}
.me{display:flex;align-items:center;gap:12px;font-size:var(--fs-s)}
.me b{font-size:var(--fs)}
.me button{min-height:44px;padding:0 18px;font-size:var(--fs-s)}
@media (max-width:820px){.brand span{display:none}}

.hero{padding:36px 0 8px}
.hero p{margin:12px 0 0;color:var(--m);font-size:var(--fs-l);max-width:900px}
@media (max-width:820px){.hero{padding:22px 0 4px}.hero p{font-size:var(--fs)}}

/* вкладки: одна группа, одинаковые кнопки */
.tabs{position:sticky;top:0;z-index:20;background:var(--bg);box-shadow:0 0 0 100vmax var(--bg);clip-path:inset(0 -100vmax);padding:16px 0;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;max-width:760px}
@media (max-width:820px){.tabs{position:static;grid-template-columns:repeat(2,1fr);box-shadow:none;clip-path:none}}
.tabs button{background:#fff;color:var(--k);border-color:var(--l);min-height:56px;font-size:var(--fs);padding:0 10px}
.tabs button:hover{border-color:var(--k)}
.tabs button[aria-selected=true]{background:var(--k);color:#fff;border-color:var(--k)}
.parts{display:flex;flex-wrap:wrap;gap:10px;margin-top:16px}
.parts button{min-height:44px;font-size:var(--fs-s);background:#fff;color:var(--k);border-color:var(--l)}
.parts button[aria-pressed=true]{background:var(--k);color:#fff;border-color:var(--k)}
section.scr{display:none;padding:8px 0 80px}section.scr.on{display:block}

.box{background:#fff;border:1px solid var(--l);border-radius:var(--rad);padding:24px}
@media (max-width:820px){.box{padding:18px}}
.lead{font-size:var(--fs-l);margin:4px 0 18px;line-height:1.35}
.lead small{display:block;font-size:var(--fs-s);color:var(--m);margin-top:6px}
.msg{border-radius:16px;padding:14px 18px;margin:14px 0 0;font-size:var(--fs)}
.msg.ok{background:var(--gl)}.msg.er{background:var(--rl);color:var(--r)}
.note{background:#fff;border:1px solid var(--l);border-radius:var(--rad);padding:20px 24px;margin:0 0 20px;font-size:var(--fs)}
.note b{font-size:var(--fs-l);display:block;margin-bottom:4px;font-family:TT,Roboto,sans-serif;font-weight:800}

/* кто ставит */
.who h2{margin-bottom:6px}
.names{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:16px 0;max-width:760px}
.names button{background:#fff;color:var(--k);border-color:var(--l);font-size:var(--fs)}
.names button:hover{border-color:var(--k)}
.other{display:grid;grid-template-columns:1fr auto;gap:10px;max-width:760px}
.other input{font:inherit;min-height:var(--btn-h);border:2px solid var(--l);border-radius:999px;padding:0 22px;min-width:0}
@media (max-width:820px){.names{grid-template-columns:1fr 1fr 1fr}.other{grid-template-columns:1fr}}

/* сетка баннеров: 5 в ряд на компьютере, список на телефоне */
.grid{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:var(--gap);align-items:start}
.grid.extra{margin-top:var(--gap)}
.c{background:#fff;border:1px solid var(--l);border-radius:var(--rad);padding:var(--pad);display:flex;flex-direction:column;gap:12px;min-width:0;position:relative}
.c .hd{display:flex;align-items:baseline;justify-content:space-between;gap:8px;min-height:34px}
.c .pl{font:800 var(--fs-place)/1.05 TT,Roboto,sans-serif}
.c .pts{font-size:var(--fs-s);color:var(--m);white-space:nowrap}
.c .pl{white-space:nowrap}
@media (min-width:821px){.c .hd{flex-direction:column;align-items:flex-start;gap:4px;justify-content:flex-start}}
.c .pts.big{font:800 var(--fs-l)/1 TT,Roboto,sans-serif;color:var(--gd)}
.ph{position:relative;width:100%;aspect-ratio:3/5;border-radius:14px;overflow:hidden;background:#fff;cursor:zoom-in;display:block;padding:0;border:0}
.ph img{display:block;width:100%;height:100%;object-fit:contain}
.c .tt{font-size:var(--fs-s);color:var(--m);line-height:1.3;min-height:2.6em}
.c .up{font-size:var(--fs-s);font-weight:700;color:var(--gd);background:var(--gl);border-radius:999px;padding:4px 10px;align-self:flex-start}
.grip{display:none}
#slots .c{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
#slots .c img{-webkit-touch-callout:none}
.lst{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:6px;font-size:var(--fs-s)}
.lst li{display:flex;justify-content:space-between;gap:8px;border-top:1px solid var(--l);padding-top:6px}
.lst li:first-child{border-top:0;padding-top:0}
.lst .nm{font-weight:700;flex:0 0 auto;white-space:nowrap}
.lst li>span:last-child{text-align:right;min-width:0}
.lst .hit{color:var(--gd);font-weight:700}
.st{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;text-align:center}
.st div{background:var(--bg);border-radius:12px;padding:8px 4px}
.st b{display:block;font:800 var(--fs-l)/1.1 TT,Roboto,sans-serif}
.st span{font-size:var(--fs-s);color:var(--m)}
@media (min-width:821px){.st{grid-template-columns:minmax(0,1fr)}.st div{display:flex;flex-direction:row-reverse;flex-wrap:wrap-reverse;justify-content:space-between;align-items:baseline;gap:0 8px;padding:8px 12px;text-align:left}.st b{white-space:nowrap}#vbody .grid{align-items:stretch}#vbody .c>.body{margin-top:auto}}
.st div{min-width:0}
.nodata{background:var(--bg);border-radius:12px;padding:12px;text-align:center;font-weight:700}
.ok-tag{display:inline-block;font-size:var(--fs-s);font-weight:700;color:var(--gd);background:var(--gl);border-radius:999px;padding:2px 10px;margin-left:6px}
.c.on{box-shadow:0 0 0 3px var(--g)}
.c.drag{opacity:.35}
.c.fresh{box-shadow:0 0 0 3px #f4c20d}

@media (hover:hover) and (pointer:fine){
  #slots .c{cursor:grab}
  .ph img{transition:transform .2s}
  .ph:hover img{transform:scale(1.03)}
}

/* телефон: баннер на всю ширину карточки */
@media (max-width:820px){
  .grid{grid-template-columns:1fr}
  .c{display:flex;flex-direction:column;gap:12px}
  .c .hd{min-height:0}
  .c .body{display:flex;flex-direction:column;gap:10px;min-width:0}

  .grip{display:flex;align-items:center;justify-content:center;gap:8px;min-height:52px;border:2px dashed var(--l);border-radius:14px;color:var(--m);font-size:var(--fs-s);font-weight:700;touch-action:none;user-select:none;-webkit-user-select:none;cursor:grab}
  .grip svg{width:18px;height:18px}
  .c .tt{min-height:0}
}
@media (min-width:821px){.c .body{display:flex;flex-direction:column;gap:12px}}

@media (max-width:820px){.c.it>.pg{font-size:var(--fs)}}

.act{display:flex;flex-wrap:wrap;align-items:center;gap:16px;margin-top:24px}
.act button{min-width:280px;font-size:var(--fs-l);min-height:60px}
.act .mine{color:var(--m);font-size:var(--fs-s)}
@media (max-width:820px){.act button{width:100%;min-width:0}}

/* под-вкладки «Все ставки»: одна группа, одинаковые кнопки */
.sub{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;margin:0 0 20px}
.sub button{background:#fff;color:var(--k);border-color:var(--l);min-height:52px;padding:0 10px;font-size:var(--fs)}
.sub button:hover{border-color:var(--k)}
.sub button[aria-selected=true]{background:var(--k);color:#fff;border-color:var(--k)}
.sub button .n{font-weight:400;font-size:var(--fs-s);opacity:.7}
@media (max-width:820px){.sub{grid-template-columns:repeat(3,1fr)}.sub button{font-size:var(--fs-s);padding:0 6px}}

.tbl{width:100%;border-collapse:collapse;font-size:var(--fs)}
.tbl th,.tbl td{text-align:left;padding:12px 10px;border-top:1px solid var(--l)}
.tbl th{font-size:var(--fs-s);color:var(--m);font-weight:400;border-top:0}
.tbl td.n,.tbl th.n{white-space:nowrap}
.tblw{overflow-x:auto;-webkit-overflow-scrolling:touch}

.upl{margin-top:40px}
.upl .row{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,2fr) minmax(0,1fr);gap:10px;margin-top:14px}
.upl input[type=text]{font:inherit;min-height:var(--btn-h);border:2px solid var(--l);border-radius:999px;padding:0 22px;min-width:0}
.vh{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.fbtn{display:flex;align-items:center;justify-content:center;min-height:var(--btn-h);border:2px solid var(--l);border-radius:999px;padding:0 22px;background:#fff;font-weight:700;font-size:var(--fs);cursor:pointer;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fbtn:hover,.vh:focus-visible+.fbtn{border-color:var(--k)}
.fbtn.on{font-weight:400}
.upl .mylist{display:flex;flex-wrap:wrap;gap:10px;margin-top:14px}
@media (max-width:820px){.upl .row{grid-template-columns:1fr}}

/* увеличение при наведении и по тапу */
#zoom{position:fixed;z-index:60;pointer-events:none;background:#fff;border-radius:18px;box-shadow:0 18px 60px rgba(0,0,0,.28);padding:8px;opacity:0;transition:opacity .15s}
#zoom.on{opacity:1}
#zoom img{display:block;width:100%;height:100%;object-fit:contain;border-radius:12px}
#lb{position:fixed;inset:0;z-index:80;background:rgba(17,17,17,.88);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;padding:16px}
#lb img{max-width:100%;max-height:calc(100vh - 120px);max-height:calc(100dvh - 120px);object-fit:contain;border-radius:14px;background:#fff}
#lb button{min-width:200px}
#ghost{position:fixed;z-index:70;pointer-events:none;border-radius:14px;overflow:hidden;box-shadow:0 18px 50px rgba(0,0,0,.35);transform:rotate(0deg)}
#ghost img{display:block;width:100%;height:100%;object-fit:contain}

/* лента и плашка «Лучшее место недели» */
.strip{display:flex;width:100%;margin-top:16px;background:var(--k);border-color:var(--k);border-radius:var(--rad);justify-content:space-between;text-align:left;padding:10px 22px;gap:6px 16px;flex-wrap:wrap}
.strip:hover{background:#2a2a2a;border-color:#2a2a2a}
.strip .go{color:#7be3a6;white-space:nowrap}
.wk{position:relative;background:var(--k);color:#fff;border-radius:var(--rad);padding:28px 28px 24px;margin:0 0 24px;overflow:hidden}
.wk>*{position:relative}
.wk canvas{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.wk .kick{font:800 var(--fs-l)/1.1 TT,Roboto,sans-serif;color:#7be3a6;margin:0 0 8px}
.wk h2{color:#fff;font-size:var(--fs-h2);overflow-wrap:anywhere}
.wk .sub2{margin:10px 0 0;font-size:var(--fs);color:#e3e6e1}
.wk .cond{display:inline-block;margin-top:12px;background:#f4c20d;color:var(--k);border-radius:999px;padding:6px 14px;font-weight:700;font-size:var(--fs-s)}
.pod{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px;align-items:end;margin-top:26px;max-width:760px}
.pod.n2{grid-template-columns:repeat(2,minmax(0,1fr));max-width:520px}.pod.n1{grid-template-columns:minmax(0,1fr);max-width:260px}
.pod.many{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.pd{display:flex;flex-direction:column;min-width:0;text-align:center}
.pd .nm{font:800 var(--fs-l)/1.15 TT,Roboto,sans-serif;overflow-wrap:anywhere;margin-bottom:4px}
.pd .pt{font-size:var(--fs-s);color:#e3e6e1;margin-bottom:8px}
.pd .bar{display:flex;align-items:flex-start;justify-content:center;padding-top:10px;border-radius:14px 14px 0 0;font:800 36px/1 TT,Roboto,sans-serif;color:var(--k)}
.pd.r1 .bar{height:150px;background:#f4c20d}.pd.r2 .bar{height:110px;background:#fff}.pd.r3 .bar{height:80px;background:var(--g)}
.wk .acts{margin-top:18px;display:flex;flex-wrap:wrap;gap:10px}
.wk .acts button{min-height:44px;font-size:var(--fs-s)}
.wk .old{margin-top:22px;border-top:1px solid #3a3a3a;padding-top:16px}
.wk .old h3{font-size:var(--fs);margin:0 0 8px;color:#e3e6e1}
.wk .old ul{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:8px;font-size:var(--fs-s)}
.wk .old li b{color:#fff}
@media (max-width:820px){.wk{padding:22px 16px 20px}.pod{gap:8px}.pd .bar{font-size:30px}.strip{padding:12px 16px}}
@media (prefers-reduced-motion:reduce){.wk canvas,.wk .acts .rp{display:none}.wk::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 12% 18%,#0aba59 0 3px,transparent 4px),radial-gradient(circle at 88% 14%,#f4c20d 0 3px,transparent 4px),radial-gradient(circle at 70% 82%,#fff 0 2px,transparent 3px),radial-gradient(circle at 22% 78%,#f4c20d 0 2px,transparent 3px),radial-gradient(circle at 50% 8%,#fff 0 2px,transparent 3px)}}

/* «Форматы» */
.fil{margin:0 0 18px}
.fil h3{font-size:var(--fs);margin:0 0 8px;font-family:Roboto,Arial,sans-serif;font-weight:700;color:var(--m)}
.chips{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:10px}
.chips button{background:#fff;color:var(--k);border-color:var(--l);min-height:48px;padding:0 10px;font-size:var(--fs-s)}
.chips button:hover{border-color:var(--k)}
.chips button[aria-pressed=true]{background:var(--k);color:#fff;border-color:var(--k)}
@media (max-width:820px){.chips{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fcnt{margin:4px 0 20px;color:var(--m);font-size:var(--fs-s)}
.fsec{margin:0 0 40px}
.fsec>p{margin:8px 0 18px;color:var(--m);font-size:var(--fs);max-width:820px}
.fgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,320px),1fr));gap:var(--gap);align-items:start}
.fc{background:#fff;border:1px solid var(--l);border-radius:var(--rad);padding:var(--pad);display:flex;flex-direction:column;gap:12px;min-width:0}
.fc.wide{grid-column:1/-1}
.fc .im{display:block;width:100%;border-radius:12px;background:var(--bg);padding:0;border:0;min-height:0;cursor:zoom-in}
.fc img,.fc video{display:block;max-width:100%;height:auto;border-radius:12px}
.fc video{width:100%;background:#000}
.fc .ft{font:800 var(--fs-l)/1.2 TT,Roboto,sans-serif;margin:0;overflow-wrap:anywhere}
.fc .fx{margin:0;font-size:var(--fs)}
.fc .meta{display:flex;flex-wrap:wrap;gap:6px 8px;font-size:var(--fs-s);color:var(--m);align-items:center}
.tagy{display:inline-block;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--gl);color:var(--gd)}
.tagn{display:inline-block;font-weight:700;border-radius:999px;padding:3px 10px;background:var(--bg);color:var(--m)}
.serp{border:1px solid var(--l);border-radius:14px;padding:16px;background:#fff}
.serp .ad{font-size:var(--fs-s);color:var(--m);margin-bottom:4px}
.serp .ad b{color:var(--k);font-weight:700;border:1px solid var(--m);border-radius:4px;padding:0 4px;margin-right:6px}
.serp .ft{font-size:var(--fs-l);text-decoration:underline}
.sizes{display:flex;flex-wrap:wrap;gap:20px;align-items:flex-end}
.sz{display:flex;flex-direction:column;gap:6px;min-width:0;max-width:100%}
.sz .im{border:1px solid var(--l);padding:0}
.sz span{font-size:var(--fs-s);color:var(--m)}
.nof{background:#fff;border:1px solid var(--l);border-radius:var(--rad);padding:24px;text-align:center}
.nof button{margin-top:12px}
footer{color:var(--m);font-size:var(--fs-s);padding:0 0 40px}
</style>
</head>
<body>
<header class="top"><div class="wrap">
  <div class="brand"><img src="assets/logo.png" alt="Каталист" width="48" height="48"><span>Тотализатор баннеров</span></div>
  <div class="me" id="me" hidden><span>Вы: <b id="meName"></b></span><button class="lt" id="meChange" type="button">Сменить имя</button></div>
</div></header>

<main class="wrap">
  <div class="hero"><h1 id="pName">Тотализатор баннеров</h1><p id="pDesc"></p><div class="parts" id="parts" hidden></div></div>
  <button class="strip" id="wkstrip" type="button" hidden><span id="wkstripT"></span><span class="go">Подробнее в «Итогах»</span></button>
  <nav class="tabs" role="tablist">
    <button id="tab-stavka" role="tab" type="button" aria-selected="true">Ставка</button>
    <button id="tab-vse" role="tab" type="button" aria-selected="false">Все ставки</button>
    <button id="tab-itogi" role="tab" type="button" aria-selected="false">Итоги</button>
    <button id="tab-formaty" role="tab" type="button" aria-selected="false">Форматы</button>
  </nav>

  <section class="scr on" id="s-stavka">
    <div class="box who" id="who" hidden>
      <h2>Кто делает ставку?</h2>
      <div class="names" id="names"></div>
      <form class="other" id="otherf"><input id="other" maxlength="24" placeholder="Другое имя" aria-label="Другое имя" autocomplete="off"><button type="submit">Это я</button></form>
    </div>
    <div id="game">
      <p class="lead" id="hint"></p>
      <div id="slots"></div>
      <div class="act"><button id="send" type="button">Сделать ставку</button><span class="mine" id="mine"></span></div>
      <div id="msg"></div>
      <div class="box upl" id="upl"></div>
    </div>
  </section>

  <section class="scr" id="s-vse">
    <div class="sub" id="vtabs" role="tablist"></div>
    <div id="vbody"></div>
  </section>

  <section class="scr" id="s-itogi"><div id="wkbox"></div><div id="ibody"></div></section>
  <section class="scr" id="s-formaty"><div id="fbody"></div></section>
</main>
<footer class="wrap" id="foot"></footer>

<div id="zoom" aria-hidden="true"><img alt=""></div>
<div id="lb" hidden role="dialog" aria-modal="true" aria-label="Баннер крупно"><img alt=""><button type="button" id="lbClose">Закрыть</button></div>

<script>
(function(){
'use strict';
var D=null,API='',ORIGIN='',ME='',CUR=null,BETS=[],UPS=[],ORDER=[],MOVED=false,FRESH={},TAB='stavka',VT='svodka';
var NAMES=['Маша','Никита','Ирек'];
var $=function(id){return document.getElementById(id)};
function el(t,c,x){var e=document.createElement(t);if(c)e.className=c;if(x!=null)e.textContent=x;return e}
function ls(k,v){try{if(v===undefined)return localStorage.getItem(k);if(v===null)localStorage.removeItem(k);else localStorage.setItem(k,v)}catch(e){return null}}
function fmt(s){if(!s)return'';return new Date(s).toLocaleString('ru-RU',{timeZone:'Europe/Moscow',day:'2-digit',month:'2-digit',hour:'2-digit',minute:'2-digit'})+' МСК'}
function num(n){return Number(n||0).toLocaleString('ru-RU')}
function pl(n,a,b,c){n=Math.abs(n)%100;var m=n%10;return n>10&&n<20?c:m>1&&m<5?b:m==1?a:c}
function balls(n){return n+'\u00a0'+pl(n,'балл','балла','баллов')}
function pts(place){return Math.max(0,6-place)}
function clean(s){return s.replace(/\s+/g,' ').trim()}
function nameOk(s){return /^[0-9A-Za-zА-Яа-яЁё][0-9A-Za-zА-Яа-яЁё .'_-]{0,23}$/.test(s)}
function isClosed(p){return !!(p.itog||(p.zakrytie&&Date.now()>=Date.parse(p.zakrytie)))}
function isMobile(){return window.matchMedia('(max-width:820px)').matches}
var canHover=window.matchMedia('(hover:hover) and (pointer:fine)').matches;

/* ---------- баннеры ---------- */
function allB(p){
  var r=p.bannery.map(function(b){return{id:b.id,zagolovok:b.zagolovok||'',src:'img/'+p.id+'/'+b.img.split('/').pop(),up:false}});
  if(p===CUR)UPS.forEach(function(u){r.push({id:u.id,zagolovok:u.zagolovok||'',src:ORIGIN+u.url,up:true,kto:u.kto,w:u.w,h:u.h})});
  return r}
function bById(id){return allB(CUR).filter(function(b){return b.id===id})[0]}
function bName(id){var b=bById(id)||{};return b.zagolovok?'«'+b.zagolovok+'»':(b.up?'баннер участника '+(b.kto||''):'баннер без заголовка')}
function ids(){return allB(CUR).map(function(b){return b.id})}
function eff(order){var a=ids();return (order||[]).filter(function(i){return a.indexOf(i)>=0})}
function photo(b){
  var w=el('button','ph');w.type='button';w.setAttribute('aria-label','Баннер '+b.id+' крупно');
  var im=new Image();im.alt='Баннер '+b.id+(b.zagolovok?': '+b.zagolovok:'');im.width=720;im.height=1200;im.draggable=false;im.decoding='async';
  im.onload=function(){var r=im.naturalWidth/im.naturalHeight;if(r&&Math.abs(r-0.6)>0.006)w.style.aspectRatio=im.naturalWidth+'/'+im.naturalHeight};
  if(b.w&&b.h&&Math.abs(b.w/b.h-0.6)>0.006)w.style.aspectRatio=b.w+'/'+b.h;
  im.src=b.src;w.appendChild(im);w.dataset.src=b.src;
  w.addEventListener('click',function(e){if(Date.now()-DRAG_END<350){e.preventDefault();return}openLb(b.src,im.alt)});
  if(canHover){w.addEventListener('mouseenter',function(){zoomShow(w)});w.addEventListener('mousemove',function(){if(!zt&&!$('zoom').classList.contains('on'))zoomShow(w)});w.addEventListener('mouseleave',zoomHide)}
  return w}
function card(cls){var c=el('div','c'+(cls?' '+cls:''));return c}
function head(left,right,big){var h=el('div','hd');h.appendChild(el('span','pl',left));if(right!=null)h.appendChild(el('span','pts'+(big?' big':''),right));return h}

/* ---------- увеличение ---------- */
var zt=null;
function zoomShow(w){clearTimeout(zt);zt=setTimeout(function(){zt=null;
  if(DRAG&&DRAG.on)return;var z=$('zoom'),im=z.firstChild,r=w.getBoundingClientRect(),img=w.firstChild;
  var ratio=(img.naturalWidth&&img.naturalHeight)?img.naturalWidth/img.naturalHeight:0.6;
  var H=Math.min(window.innerHeight-40,820,(window.innerWidth-40)/ratio),W=H*ratio+16;H+=16;
  var gap=20,x;
  if(r.right+gap+W<=window.innerWidth-12)x=r.right+gap;
  else if(r.left-gap-W>=12)x=r.left-gap-W;
  else x=Math.max(12,(window.innerWidth-W)/2);
  var y=Math.min(Math.max(12,r.top+r.height/2-H/2),window.innerHeight-H-12);
  z.style.width=W+'px';z.style.height=H+'px';z.style.left=x+'px';z.style.top=y+'px';im.src=w.dataset.src;z.classList.add('on')},180)}
function zoomHide(){clearTimeout(zt);zt=null;$('zoom').classList.remove('on')}
window.addEventListener('scroll',zoomHide,{passive:true});
function openLb(src,alt){zoomHide();var lb=$('lb');lb.firstChild.src=src;lb.firstChild.alt=alt||'';lb.hidden=false;$('lbClose').focus()}
function closeLb(){$('lb').hidden=true}
$('lb').addEventListener('click',closeLb);
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&!$('lb').hidden)closeLb()});

/* ---------- данные ---------- */
function loadBets(){if(!CUR)return Promise.resolve();
  return fetch(API+'/stavki?partiya='+encodeURIComponent(CUR.id),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){if(j.ok)BETS=j.stavki||[]}).catch(function(){})}
function loadUps(){if(!CUR)return Promise.resolve(false);
  return fetch(API+'/bannery?partiya='+encodeURIComponent(CUR.id),{cache:'no-store'}).then(function(r){return r.json()}).then(function(j){
    if(!j.ok)return false;var a=JSON.stringify(UPS.map(function(u){return u.id}));UPS=j.bannery||[];return a!==JSON.stringify(UPS.map(function(u){return u.id}))}).catch(function(){return false})}
function myBet(){var k=ME.toLocaleLowerCase('ru');return BETS.filter(function(s){return s.imya.toLocaleLowerCase('ru')===k})[0]}
function claudeOrder(){var c=CUR.claude||{};return eff(c.vse&&c.vse.length?c.vse:c.poryadok)}

/* ---------- кто ставит ---------- */
function showWho(on){$('who').hidden=!on;$('game').hidden=on&&!ME;if(on)setTimeout(function(){var b=$('names').firstChild;if(b)b.focus()},0)}
function setMe(n){ME=n;ls('tot_imya',n);$('me').hidden=false;$('meName').textContent=n;$('who').hidden=true;$('game').hidden=false;fillOrder();renderStavka()}
NAMES.forEach(function(n){var b=el('button','',n);b.type='button';b.onclick=function(){setMe(n)};$('names').appendChild(b)});
$('otherf').onsubmit=function(e){e.preventDefault();var v=clean($('other').value);
  if(!nameOk(v)){alert('Имя: до 24 знаков, буквы и цифры');return}
  if(/^(claude|клод|клауд)$/i.test(v)){alert('Это имя занято');return}setMe(v)};
$('meChange').onclick=function(){$('me').hidden=true;showWho(true)};

/* ---------- порядок ---------- */
function shuffled(a){a=a.slice();for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1)),t=a[i];a[i]=a[j];a[j]=t}return a}
function saveOrder(){if(CUR){ls('tot3_ord_'+CUR.id+'_'+ME,JSON.stringify(ORDER));ls('tot3_mv_'+CUR.id+'_'+ME,MOVED?'1':'0')}}
function fillOrder(){if(!CUR)return;var all=ids(),mb=myBet(),d=null;FRESH={};
  if(mb){ORDER=eff(mb.poryadok);MOVED=true}
  else{try{d=JSON.parse(ls('tot3_ord_'+CUR.id+'_'+ME))}catch(e){}
    if(d&&d.length&&eff(d).length===d.length){ORDER=d;MOVED=ls('tot3_mv_'+CUR.id+'_'+ME)==='1'}else{ORDER=shuffled(all);MOVED=false}}
  all.forEach(function(i){if(ORDER.indexOf(i)<0){ORDER.push(i);if(mb)FRESH[i]=1}});saveOrder()}
function move(i,j){if(j<0||j>=ORDER.length||i===j)return;var x=ORDER.splice(i,1)[0];ORDER.splice(j,0,x);MOVED=true;saveOrder()}

/* ---------- экран «Ставка» ---------- */
var GRIP='<svg viewBox="0 0 20 20" aria-hidden="true"><circle cx="7" cy="4" r="1.8"/><circle cx="13" cy="4" r="1.8"/><circle cx="7" cy="10" r="1.8"/><circle cx="13" cy="10" r="1.8"/><circle cx="7" cy="16" r="1.8"/><circle cx="13" cy="16" r="1.8"/></svg>';
function renderStavka(){
  if(!CUR)return;var closed=isClosed(CUR),n=ORDER.length;
  $('hint').innerHTML='';
  $('hint').appendChild(document.createTextNode(closed?'Приём ставок по этой партии закрыт. Ниже ваша расстановка.':(isMobile()?'Расставьте баннеры по местам: зажмите баннер пальцем и тащите на нужное место. ':'Перетащите баннеры по местам мышью. ')));
  if(!closed){var sm=el('small',null,'1 место: баннер, который соберёт больше всего кликов на 100 показов (CTR, %). Нажмите на баннер, чтобы рассмотреть крупно.');$('hint').appendChild(sm)}
  var box=$('slots');box.innerHTML='';
  var g=el('div','grid');box.appendChild(g);
  ORDER.forEach(function(id,i){
    if(i===5){g=el('div','grid extra');box.appendChild(g)}
    var b=bById(id);if(!b)return;
    var c=card(FRESH[id]?'fresh':'');c.dataset.id=id;c.dataset.i=i;
    c.appendChild(head((i+1)+' место',balls(pts(i+1))));
    c.appendChild(photo(b));
    var body=el('div','body');
    if(b.zagolovok)body.appendChild(el('div','tt',b.zagolovok));
    if(b.up)body.appendChild(el('span','up','Загрузка: '+(b.kto||'участник')));
    if(FRESH[id])body.appendChild(el('span','up','Новый баннер: поставьте на место'));
    if(!closed){
      var gr=el('div','grip');gr.innerHTML=GRIP+'<span>Тяните</span>';gr.setAttribute('aria-hidden','true');body.appendChild(gr);
      c.addEventListener('pointerdown',dragStart);
      c.addEventListener('touchstart',holdStart,{passive:true});
      c.addEventListener('contextmenu',function(e){e.preventDefault()});
      c.addEventListener('keydown',function(e){var k=e.key,d=(k==='ArrowLeft'||k==='ArrowUp')?-1:(k==='ArrowRight'||k==='ArrowDown')?1:0;
        if(!d||!e.target.closest('.ph'))return;e.preventDefault();var j=ORDER.indexOf(id);move(j,j+d);renderStavka();
        var f=document.querySelector('#slots .c[data-id="'+id+'"] .ph');if(f)f.focus()});
    }
    c.appendChild(body);g.appendChild(c)});
  var mb=myBet();$('send').hidden=closed;$('send').textContent=mb?'Обновить ставку':'Сделать ставку';
  $('mine').textContent=mb?('Ваша ставка принята '+fmt(mb.vremya)+'. Поменять можно до закрытия партии.'):(MOVED?'':'Сначала переставьте баннеры, потом отправьте ставку.');
  renderUpl()}

/* ---------- перетаскивание (мышь: вся карточка; палец: удержание на карточке или полоса «Тяните») ---------- */
var DRAG=null,DRAG_END=0;
function dragStart(e){
  if(e.button>0)return;
  var c=e.currentTarget;
  if(e.pointerType!=='mouse'&&!e.target.closest('.grip'))return;
  DRAG={c:c,id:c.dataset.id,x:e.clientX,y:e.clientY,px:e.clientX,py:e.clientY,on:false,pid:e.pointerId,raf:0};
  if(e.target.closest('.grip'))e.preventDefault();
  document.addEventListener('pointermove',dragMove,{passive:false});document.addEventListener('pointerup',dragEnd);document.addEventListener('pointercancel',dragEnd)}
function dragOn(){DRAG.on=true;zoomHide();var ph=DRAG.c.querySelector('.ph'),r=ph.getBoundingClientRect(),g=el('div');g.id='ghost';
    var gw=Math.min(r.width,isMobile()?140:r.width*.85);g.style.width=gw+'px';g.style.height=(gw*r.height/r.width)+'px';
    g.appendChild(ph.firstChild.cloneNode());document.body.appendChild(g);DRAG.g=g;DRAG.gw=gw;DRAG.gh=gw*r.height/r.width;
    g.style.left=(DRAG.px-gw/2)+'px';g.style.top=(DRAG.py-DRAG.gh/2)+'px';
    DRAG.c.classList.add('drag');document.body.style.userSelect='none';DRAG.raf=requestAnimationFrame(autoScroll)}
function dragTo(x,y){DRAG.px=x;DRAG.py=y;place(x,y);DRAG.g.style.left=(x-DRAG.gw/2)+'px';DRAG.g.style.top=(y-DRAG.gh/2)+'px'}
function dragMove(e){if(!DRAG||e.pointerId!==DRAG.pid)return;DRAG.px=e.clientX;DRAG.py=e.clientY;
  if(!DRAG.on){if(Math.abs(e.clientX-DRAG.x)+Math.abs(e.clientY-DRAG.y)<8)return;dragOn()}
  e.preventDefault();dragTo(e.clientX,e.clientY)}
/* палец: удержать ~300 мс, потом тащить; быстрый свайп = прокрутка страницы */
var HOLD=null;
function holdStart(e){
  if(DRAG||HOLD||e.touches.length!==1||e.target.closest('.grip'))return;
  var t=e.touches[0],c=e.currentTarget,n=e.target;
  HOLD={c:c,n:n,x:t.clientX,y:t.clientY,px:t.clientX,py:t.clientY,tm:0};
  n.addEventListener('touchmove',holdMove,{passive:false});n.addEventListener('touchend',holdEnd);n.addEventListener('touchcancel',holdEnd);
  HOLD.tm=setTimeout(function(){if(!HOLD)return;
    DRAG={c:HOLD.c,id:HOLD.c.dataset.id,x:HOLD.x,y:HOLD.y,px:HOLD.px,py:HOLD.py,on:false,pid:'touch',raf:0};
    if(navigator.vibrate)try{navigator.vibrate(15)}catch(_){}
    dragOn()},300)}
function holdMove(e){if(!HOLD)return;var t=e.touches[0];HOLD.px=t.clientX;HOLD.py=t.clientY;
  if(!DRAG||!DRAG.on){if(Math.abs(t.clientX-HOLD.x)+Math.abs(t.clientY-HOLD.y)>10)holdEnd();return}
  e.preventDefault();dragTo(t.clientX,t.clientY)}
function holdEnd(){if(!HOLD)return;clearTimeout(HOLD.tm);var n=HOLD.n;
  n.removeEventListener('touchmove',holdMove);n.removeEventListener('touchend',holdEnd);n.removeEventListener('touchcancel',holdEnd);
  HOLD=null;if(DRAG&&DRAG.pid==='touch')dragEnd()}
function place(x,y){
  var cs=[].slice.call(document.querySelectorAll('#slots .c')),best=null,bd=1e9;
  cs.forEach(function(c){var r=c.getBoundingClientRect();
    if(x>=r.left&&x<=r.right&&y>=r.top&&y<=r.bottom){best=c;bd=0;return}
    var dx=Math.max(r.left-x,0,x-r.right),dy=Math.max(r.top-y,0,y-r.bottom),d=dx*dx+dy*dy;if(d<bd){bd=d;best=c}});
  if(!best||best===DRAG.c)return;
  var from=ORDER.indexOf(DRAG.id),to=ORDER.indexOf(best.dataset.id);if(from<0||to<0||from===to)return;
  move(from,to);renderStavka();
  DRAG.c=document.querySelector('#slots .c[data-id="'+DRAG.id+'"]');if(DRAG.c)DRAG.c.classList.add('drag')}
function autoScroll(){if(!DRAG||!DRAG.on)return;var y=DRAG.py,h=window.innerHeight,s=0;
  if(y<90)s=-Math.ceil((90-y)/6);else if(y>h-90)s=Math.ceil((y-(h-90))/6);
  if(s){window.scrollBy(0,s);place(DRAG.px,DRAG.py)}DRAG.raf=requestAnimationFrame(autoScroll)}
function dragEnd(e){if(!DRAG||(e&&e.pointerId!==DRAG.pid))return;if(DRAG.pid==='touch'&&e)return;
  document.removeEventListener('pointermove',dragMove);document.removeEventListener('pointerup',dragEnd);document.removeEventListener('pointercancel',dragEnd);
  if(DRAG.on){cancelAnimationFrame(DRAG.raf);if(DRAG.g)DRAG.g.remove();document.body.style.userSelect='';DRAG_END=Date.now();MOVED=true;saveOrder();DRAG=null;renderStavka();return}
  DRAG=null}

/* ---------- отправка ставки ---------- */
function send(){var m=$('msg');m.innerHTML='';
  if(!ME){showWho(true);return}
  if(!MOVED&&!myBet()){m.appendChild(el('div','msg er','Сначала расставьте баннеры по местам: перетащите их на нужные места.'));return}
  var b=$('send');b.disabled=true;
  fetch(API+'/stavka',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({partiya:CUR.id,imya:ME,poryadok:ORDER})})
   .then(function(r){return r.json().catch(function(){return{ok:false,oshibka:'сервер не ответил'}})})
   .then(function(j){b.disabled=false;
     if(j.ok){m.appendChild(el('div','msg ok','Ставка принята: '+eff(j.stavka.poryadok).map(function(x,i){return (i+1)+'\u00a0место: '+bName(x)}).join('; ')+'. Её можно поменять до закрытия.'));FRESH={};
       return loadBets().then(function(){renderStavka();renderVse()})}
     m.appendChild(el('div','msg er','Не вышло: '+(j.oshibka||'ошибка')));
     return loadUps().then(function(ch){if(ch){fillOrder();renderStavka()}})})
   .catch(function(){b.disabled=false;m.appendChild(el('div','msg er','Нет связи с сервером. Ваш порядок сохранён в браузере, нажмите ещё раз.'))})}

/* ---------- загрузка своего баннера ---------- */
var PREP=null;
function prepImage(file){return new Promise(function(res,rej){
  var u=URL.createObjectURL(file),im=new Image();
  im.onerror=function(){URL.revokeObjectURL(u);rej(new Error('Не удалось прочитать картинку. Нужен JPG, PNG или WebP.'))};
  im.onload=function(){var iw=im.naturalWidth,ih=im.naturalHeight;
    if(!iw||!ih){URL.revokeObjectURL(u);rej(new Error('Картинка пустая'));return}
    var ra=iw/ih;if(ra<0.3||ra>3.4){URL.revokeObjectURL(u);rej(new Error('Слишком вытянутая картинка: стороны должны отличаться не больше чем в 3 раза.'));return}
    var k=Math.min(1,1200/Math.max(iw,ih)),W=Math.round(iw*k),H=Math.round(ih*k);
    if(Math.min(W,H)<240){URL.revokeObjectURL(u);rej(new Error('Картинка слишком маленькая: нужна сторона от 240 px.'));return}
    var c=document.createElement('canvas');c.width=W;c.height=H;var x=c.getContext('2d');
    x.fillStyle='#fff';x.fillRect(0,0,W,H);x.drawImage(im,0,0,W,H);
    URL.revokeObjectURL(u);var q=.9,d;do{d=c.toDataURL('image/jpeg',q);q-=.08}while(d.length*0.75>440000&&q>.3);
    if(d.length*0.75>440000){rej(new Error('Картинка слишком тяжёлая даже после сжатия'));return}
    res(d)};
  im.src=u})}
function upName(u){return u.zagolovok?'«'+u.zagolovok+'»':'без заголовка'}
function myUps(){var r=[];UPS.forEach(function(u){var t=ls('tot_tok_'+CUR.id+'_'+u.id);if(t)r.push({u:u,t:t})});return r}
function uplBusy(){var f=$('fileup');return !!(f&&f.files&&f.files.length)}
function renderUpl(force){var box=$('upl');if(!CUR)return;
  if(isClosed(CUR)){box.hidden=true;return}box.hidden=false;
  if(uplBusy()&&!force)return;box.innerHTML='';
  box.appendChild(el('h2',null,'Добавьте свой баннер'));
  box.appendChild(el('p','lead','Ваш баннер встанет в ряд последним, его увидят все участники. Любой формат: покажем картинку целиком, в её собственной пропорции, без обрезки и полос.'));
  var row=el('div','row'),f=document.createElement('input');f.type='file';f.id='fileup';f.className='vh';f.accept='image/jpeg,image/png,image/webp';f.setAttribute('aria-label','Файл баннера');
  var fl=document.createElement('label');fl.htmlFor='fileup';fl.className='fbtn';fl.textContent='Выбрать файл';
  var ti=document.createElement('input');ti.type='text';ti.maxLength=80;ti.placeholder='Заголовок (можно пусто)';ti.setAttribute('aria-label','Заголовок баннера');
  var go=el('button','','Загрузить');go.type='button';go.disabled=true;
  f.onchange=function(){var m=$('msg');m.innerHTML='';PREP=null;go.disabled=true;fl.textContent=f.files[0]?f.files[0].name:'Выбрать файл';fl.classList.toggle('on',!!f.files[0]);if(!f.files[0])return;
    prepImage(f.files[0]).then(function(d){PREP=d;go.disabled=false}).catch(function(e){m.appendChild(el('div','msg er',e.message))})};
  go.onclick=function(){var m=$('msg');m.innerHTML='';if(!ME){showWho(true);return}if(!PREP)return;go.disabled=true;
    fetch(API+'/bannery',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({partiya:CUR.id,imya:ME,zagolovok:clean(ti.value),img:PREP.split(',')[1]})})
     .then(function(r){return r.json().catch(function(){return{ok:false,oshibka:'сервер не ответил'}})})
     .then(function(j){if(j.ok){ls('tot_tok_'+CUR.id+'_'+j.banner.id,j.token);PREP=null;f.value='';fl.textContent='Выбрать файл';fl.classList.remove('on');
         m.appendChild(el('div','msg ok','Баннер '+upName(j.banner)+' добавлен. Он стоит последним: поставьте его на место и обновите ставку.'));
         return loadUps().then(function(){var mb=myBet();fillOrder();if(!mb)MOVED=true;FRESH[j.banner.id]=1;renderStavka();renderUpl(true);renderVse()})}
       go.disabled=false;m.appendChild(el('div','msg er','Не вышло: '+(j.oshibka||'ошибка')))})
     .catch(function(){go.disabled=false;m.appendChild(el('div','msg er','Нет связи с сервером, попробуйте ещё раз.'))})};
  row.appendChild(f);row.appendChild(fl);row.appendChild(ti);row.appendChild(go);box.appendChild(row);

function chipRow(box,title,list,key){var f=el('div','fil');f.appendChild(el('h3',null,title));var c=el('div','chips');
  list.forEach(function(x){var b=el('button',null,x[1]);b.type='button';b.setAttribute('aria-pressed',FF[key]===x[0]);b.onclick=function(){FF[key]=x[0];renderFormaty()};c.appendChild(b)});f.appendChild(c);box.appendChild(f)}
function fmImg(im,alt,cls){var b=el('button','im'+(cls?' '+cls:''));b.type='button';b.setAttribute('aria-label',alt+', крупно');var i=new Image();i.src=im.src;i.width=im.w;i.height=im.h;i.alt=alt;i.loading='lazy';i.decoding='async';i.draggable=false;b.appendChild(i);b.onclick=function(){openLb(im.src,alt)};return b}
function fmMeta(it){var m=el('div','meta');m.appendChild(el('span',it.v_stavke?'tagy':'tagn',it.v_stavke?'В ставке':'Вне ставки'));
  var g={};(FM.gde||[]).forEach(function(x){g[x.id]=x.nazvanie});m.appendChild(el('span',null,'Где: '+it.tags.map(function(t){return g[t]||t}).join(', ')));return m}
function fmCard(it){var c=el('div','fc');
  if(it.format==='poisk'){var s=el('div','serp'),a=el('div','ad');a.appendChild(el('b',null,'Реклама'));a.appendChild(document.createTextNode('catalystrussia.ru'));s.appendChild(a);s.appendChild(el('div','ft',it.zagolovok));s.appendChild(el('p','fx',it.tekst));c.appendChild(s)}
  else if(it.format==='ban'){c.classList.add('wide');c.appendChild(el('h3','ft',it.zagolovok));var sz=el('div','sizes'),n=0;
    it.razmery.forEach(function(r){if(FF.s!=='all'&&r.orient!==FF.s)return;n++;var d=el('div','sz'),w=SHOWW[r.razmer.replace('×','x')]||300;d.style.width='min(100%,'+w+'px)';d.appendChild(fmImg(r,it.zagolovok+', '+r.razmer));d.appendChild(el('span',null,r.nazvanie));sz.appendChild(d)});
    if(!n)return null;c.appendChild(sz)}
  else if(it.format==='video'){var v=document.createElement('video');v.controls=true;v.preload='none';v.playsInline=true;v.poster=it.kartinka.src;v.src=it.video;v.setAttribute('aria-label',it.zagolovok);v.width=it.kartinka.w;v.height=it.kartinka.h;c.appendChild(v);c.appendChild(el('h3','ft',it.zagolovok));if(it.tekst)c.appendChild(el('p','fx',it.tekst))}
  else{if(it.kartinka){var im=fmImg(it.kartinka,it.zagolovok);if(it.format==='pb'||it.format==='cpm'){im.style.maxWidth=it.format==='pb'?'240px':'100%'}c.appendChild(im)}c.appendChild(el('h3','ft',it.zagolovok));if(it.tekst)c.appendChild(el('p','fx',it.tekst))}
  if(it.podpis)c.appendChild(el('div','meta',it.podpis));c.appendChild(fmMeta(it));return c}
function renderFormaty(){var v=$('fbody');v.innerHTML='';
  if(!FM){v.appendChild(el('p','lead','Загружаем форматы…'));loadFm().then(renderFormaty).catch(function(){v.innerHTML='';var n=el('div','nof');n.appendChild(el('p',null,'Не удалось загрузить форматы.'));var b=el('button',null,'Попробовать ещё раз');b.type='button';b.onclick=renderFormaty;n.appendChild(b);v.appendChild(n)});return}
  var nt=el('div','note');nt.appendChild(el('b',null,'Какие бывают объявления в Директе'));
  nt.appendChild(document.createTextNode('Здесь образцы того, что мы запускаем. В ставке участвуют пять светлых баннеров партии недели. Метка «В ставке» стоит у графического баннера на светлом фоне, он того же вида. Остальные форматы показаны для знакомства.'));v.appendChild(nt);
  chipRow(v,'Формат',[['all','Все форматы']].concat(FM.formaty.map(function(x){return[x.id,x.nazvanie]})),'f');
  chipRow(v,'Где показывается',[['all','Везде']].concat(FM.gde.map(function(x){return[x.id,x.nazvanie]})),'g');
  if(FF.f==='all'||FF.f==='ban')chipRow(v,'Размер баннера',SZ,'s');
  var shown=0,wrap=el('div');
  FM.formaty.forEach(function(f){if(FF.f!=='all'&&FF.f!==f.id)return;
    var its=FM.items.filter(function(i){return i.format===f.id&&(FF.g==='all'||i.tags.indexOf(FF.g)>=0)});
    var cards=its.map(fmCard).filter(Boolean);if(!cards.length)return;shown+=cards.length;
    var sec=el('div','fsec');sec.appendChild(el('h2',null,f.nazvanie));sec.appendChild(el('p',null,f.opisanie));var g=el('div','fgrid');cards.forEach(function(c){g.appendChild(c)});sec.appendChild(g);wrap.appendChild(sec)});
  if(!shown){var n=el('div','nof');n.appendChild(el('p','lead','Для такого сочетания фильтров образцов нет.'));var b=el('button',null,'Сбросить фильтры');b.type='button';b.onclick=function(){FF={f:'all',g:'all',s:'all'};renderFormaty()};n.appendChild(b);v.appendChild(n);return}
  v.appendChild(el('p','fcnt','Показано образцов: '+shown));v.appendChild(wrap)}

/* ---------- вкладки и партии ---------- */
function tab(n){TAB=n;['stavka','vse','itogi','formaty'].forEach(function(t){$('s-'+t).className='scr'+(t===n?' on':'');$('tab-'+t).setAttribute('aria-selected',t===n)});zoomHide();wkStop();
  if(n==='itogi'||n==='vse')Promise.all([loadBets(),loadUps()]).then(function(){renderVse();renderItogi();if(TAB==='itogi')wkStart(false)});
  if(n==='formaty')renderFormaty();
  var y=$('pName').closest('.hero').getBoundingClientRect().bottom+window.scrollY;if(window.scrollY>y)window.scrollTo(0,y)}
['stavka','vse','itogi','formaty'].forEach(function(t){$('tab-'+t).onclick=function(){tab(t)}});
$('send').onclick=send;
function setCur(p){CUR=p;BETS=[];UPS=[];$('pName').textContent=p.nazvanie||'Тотализатор баннеров';$('pDesc').textContent=p.opisanie||'';
  var ps=$('parts');ps.innerHTML='';ps.hidden=D.partii.length<2;
  D.partii.slice().reverse().forEach(function(q){var b=el('button',null,(q.nazvanie||q.id)+(isClosed(q)?' · закрыта':''));b.type='button';b.setAttribute('aria-pressed',q===p);b.onclick=function(){setCur(q)};ps.appendChild(b)});
  return Promise.all([loadBets(),loadUps()]).then(function(){fillOrder();renderStavka();renderVse();renderItogi();renderStrip();renderWeek();if(TAB==='itogi')wkStart(false)})}
var rt=null;window.addEventListener('resize',function(){clearTimeout(rt);rt=setTimeout(function(){if(CUR&&!(DRAG&&DRAG.on))renderStavka()},150)});
document.addEventListener('visibilitychange',function(){if(document.visibilityState==='visible'&&CUR&&!isClosed(CUR))loadUps().then(function(ch){if(ch){fillOrder();renderStavka();renderVse()}})});

fetch('partii.json',{cache:'no-store'}).then(function(r){return r.json()}).then(function(d){D=d;API=d.api;
  try{var q=new URLSearchParams(location.search).get('api');if(q&&/^(localhost|127\.0\.0\.1)$/.test(location.hostname))API=q}catch(e){}
  ORIGIN=new URL(API).origin;
  if(d.sobrano)$('foot').textContent='Страница обновлена '+fmt(d.sobrano)+'. Ставки и баннеры участников подгружаются вживую.';
  if(!d.partii.length){$('pDesc').textContent='Партий пока нет.';return}
  var open=d.partii.filter(function(p){return !isClosed(p)}),p=open.length?open[open.length-1]:d.partii[d.partii.length-1];
  ME=ls('tot_imya')||'';
  return setCur(p).then(function(){if(ME){$('me').hidden=false;$('meName').textContent=ME}else showWho(true);
    var h=(location.hash||'').slice(1);if(h==='vse'||h==='itogi'||h==='formaty')tab(h)})})
 .catch(function(){$('pDesc').textContent='Не удалось загрузить страницу. Обновите её.'});
})();
</script>
