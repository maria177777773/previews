<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Шрифты для защиты</title>
<style>body{margin:0;background:#F3F5FD;font:18px/1.4 Arial,sans-serif;color:#0F1B4C}.w{max-width:1500px;margin:0 auto;padding:32px 16px}h1{font-size:32px;margin:0 0 6px}
.g{display:grid;grid-template-columns:repeat(auto-fill,minmax(440px,1fr));gap:24px;margin-top:24px}figure{margin:0;background:#fff;border:2px solid #D9DEEA;border-radius:18px;overflow:hidden}
.box{position:relative;width:100%;aspect-ratio:16/9;overflow:hidden}.box iframe{position:absolute;left:0;top:0;width:1600px;height:900px;border:0;transform-origin:0 0;pointer-events:none}
figcaption{padding:12px 16px}figcaption b{background:#C8102E;color:#fff;padding:4px 10px;border-radius:8px;margin-right:8px}@media(max-width:500px){.g{grid-template-columns:1fr}}</style></head>
<body><div class="w"><h1>Первый слайд: варианты шрифтов</h1><p>Напиши номер, и я поставлю этот шрифт на все слайды. Шрифт названия, подзаголовка и текста указан под каждым вариантом.</p><div class="g" id="g"></div></div>
<script>var U='https://maria177777773.github.io/previews/tender-pech-zashchita/';
var L=[['Сейчас','Ruslan Display · Podkova · Golos Text'],['Книжная сказка','Kurale'],['Купеческая вывеска','Yeseva One · Lora · PT Sans'],['Дореволюционная книга','Old Standard TT · PT Sans'],['Старорусская антиква','Forum · Philosopher'],['Лубок, от руки','Underdog · Neucha · Rubik'],['Плакат','Kelly Slab · Rubik'],['Современный крупный','Russo One · Rubik'],['Советский плакат','Oswald · PT Sans'],['Мягкая сказка','Alice · PT Sans']];
var g=document.getElementById('g');L.forEach(function(x,i){var f=document.createElement('figure');f.innerHTML='<div class="box"><iframe loading="lazy" src="'+U+'?f='+i+'&v=2" tabindex="-1"></iframe></div><figcaption><b>'+(i||'0')+'</b>'+x[0]+' · '+x[1]+'</figcaption>';g.appendChild(f)});
function sc(){document.querySelectorAll('.box').forEach(function(b){b.firstChild.style.transform='scale('+b.clientWidth/1600+')'})}addEventListener('resize',sc);sc();setTimeout(sc,300)</script></body></html>
