<!-- concept: кружочки | approach: кружки падают в плотную кучу, как групповое фото | label: Групповое фото -->
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
@font-face{font-family:"Golos Text";font-weight:700;src:url(../fonts/golos-text-cyrillic-700-normal-BKmY45Ip.woff2) format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:"Golos Text";font-weight:700;src:url(../fonts/golos-text-latin-600-normal-Bhk8uV1U.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
html,body{margin:0;background:#111;overflow:hidden}
#w{width:100vw;height:56.25vw;position:relative;overflow:hidden}
#s{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#E0457B;color:#fff;font:700 16px/1.1 "Golos Text",sans-serif}
#s *{box-sizing:border-box}
.ab{position:absolute}
.h{left:0;right:0;text-align:center;font-size:60px;line-height:1.08;letter-spacing:-.01em}
.c{border-radius:50%;overflow:hidden;background:#000}.c img{width:100%;height:100%;object-fit:cover;display:block}
#rp{position:absolute;right:14px;bottom:12px;z-index:9;font:600 13px "Golos Text";color:#fff;background:rgba(0,0,0,.45);border:0;border-radius:20px;padding:6px 14px;cursor:pointer}
.h{top:50px}
.g{width:150px;height:150px;border:6px solid #E0457B;animation:drop .55s cubic-bezier(.3,1.5,.5,1) both}
@keyframes drop{from{transform:translateY(-500px) rotate(-20deg)}}
.bd{left:490px;top:600px;width:300px;text-align:center;background:#16101a;border-radius:40px;padding:16px;font-size:30px;animation:pop .4s 1.9s cubic-bezier(.3,1.6,.5,1) both}
@keyframes pop{from{transform:scale(0)}}
</style></head><body><div id="w"><div id="s">
<div class="ab h">Персонал сам придёт на ваше мероприятие</div><div class="ab c g" style="left:290px;top:170px;z-index:20;animation-delay:0.10s"><img src="../img/pam.jpg"></div><div class="ab c g" style="left:430px;top:170px;z-index:19;animation-delay:0.22s"><img src="../img/p5.jpg"></div><div class="ab c g" style="left:570px;top:170px;z-index:18;animation-delay:0.34s"><img src="../img/p9.jpg"></div><div class="ab c g" style="left:710px;top:170px;z-index:17;animation-delay:0.46s"><img src="../img/p2.jpg"></div><div class="ab c g" style="left:850px;top:170px;z-index:16;animation-delay:0.58s"><img src="../img/p6.jpg"></div><div class="ab c g" style="left:220px;top:300px;z-index:15;animation-delay:0.70s"><img src="../img/p11.jpg"></div><div class="ab c g" style="left:360px;top:300px;z-index:14;animation-delay:0.82s"><img src="../img/p3.jpg"></div><div class="ab c g" style="left:500px;top:300px;z-index:13;animation-delay:0.94s"><img src="../img/p8.jpg"></div><div class="ab c g" style="left:640px;top:300px;z-index:12;animation-delay:1.06s"><img src="../img/p10.jpg"></div><div class="ab c g" style="left:780px;top:300px;z-index:11;animation-delay:1.18s"><img src="../img/p4.jpg"></div><div class="ab c g" style="left:920px;top:300px;z-index:10;animation-delay:1.30s"><img src="../img/p7.jpg"></div><div class="ab c g" style="left:1060px;top:300px;z-index:9;animation-delay:1.42s"><img src="../img/p12.jpg"></div><div class="ab bd">Команда: 12 из 12</div></div><button id="rp" onclick="rp()">↻ повторить</button></div>
<script>
function fit(){const k=innerWidth/1280;document.getElementById('s').style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
function rp(){const s=document.getElementById('s');s.style.animation='none';s.querySelectorAll('*').forEach(e=>{const a=e.style.animationName;e.style.animation='none';e.offsetHeight;e.style.animation=''});}
setInterval(rp,6500);
</script></body></html>
