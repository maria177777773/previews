<!-- concept: интерфейс | approach: чат мероприятия: каждый сам пишет «буду» | label: Чат «Буду!» -->
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
@font-face{font-family:"Golos Text";font-weight:700;src:url(../fonts/golos-text-cyrillic-700-normal-BKmY45Ip.woff2) format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:"Golos Text";font-weight:700;src:url(../fonts/golos-text-latin-600-normal-Bhk8uV1U.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
html,body{margin:0;background:#111;overflow:hidden}
#w{width:100vw;height:56.25vw;position:relative;overflow:hidden}
#s{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#E0457B;color:#fff;font:700 16px/1.1 "Golos Text",sans-serif}
#s *{box-sizing:border-box}
.ab{position:absolute}
.h{left:0;right:0;text-align:center;font-size:60px;line-height:1.08;letter-spacing:-.01em}
.c{border-radius:50%;overflow:hidden;background:#000}.c img{width:100%;height:100%;object-fit:cover;display:block}
#rp{position:absolute;right:14px;bottom:12px;z-index:9;font:600 13px "Golos Text";color:#fff;background:rgba(0,0,0,.45);border:0;border-radius:20px;padding:6px 14px;cursor:pointer}
.h{left:70px;right:auto;top:200px;width:520px;text-align:left;font-size:64px}
.ch{left:660px;top:40px;width:560px;height:640px;background:#16101a;border-radius:34px;padding:22px 24px;overflow:hidden}
.ch .t{font-size:22px;color:#ff8fc0;padding-bottom:14px;border-bottom:2px solid #2c2230;margin-bottom:10px}
.m{display:flex;align-items:center;gap:14px;margin:12px 0;animation:in .35s both}
.m .c{width:58px;height:58px;flex:none}
.m .b{background:#2c2230;border-radius:20px 20px 20px 6px;padding:12px 18px;font-size:22px}
.m .b small{display:block;font-size:15px;color:#ff8fc0;font-weight:600;margin-bottom:3px}
@keyframes in{from{opacity:0;transform:translateY(20px)}}
</style></head><body><div id="w"><div id="s">
<div class="ab h">Персонал сам придёт на ваше мероприятие</div><div class="ab ch"><div class="t">Корпоратив 27.12 · 7 из 7 подтвердили</div><div class="m" style="animation-delay:0.30s"><div class="c"><img src="../img/pam.jpg"></div><div class="b"><small>Памела · Промо-модель</small>Буду в 18:00 ✓</div></div><div class="m" style="animation-delay:0.75s"><div class="c"><img src="../img/p9.jpg"></div><div class="b"><small>Сергей Петрович · Дед Мороз</small>Уже выезжаю</div></div><div class="m" style="animation-delay:1.20s"><div class="c"><img src="../img/p10.jpg"></div><div class="b"><small>Андрей · Дед Мороз</small>Костюм глажу 🎅</div></div><div class="m" style="animation-delay:1.65s"><div class="c"><img src="../img/p2.jpg"></div><div class="b"><small>Катя · Хостес</small>На месте за час</div></div><div class="m" style="animation-delay:2.10s"><div class="c"><img src="../img/p5.jpg"></div><div class="b"><small>Тимур · Аниматор</small>Беру реквизит</div></div><div class="m" style="animation-delay:2.55s"><div class="c"><img src="../img/p11.jpg"></div><div class="b"><small>Миша · Официант</small>Буду!</div></div><div class="m" style="animation-delay:3.00s"><div class="c"><img src="../img/p4.jpg"></div><div class="b"><small>Лера · Хостес</small>Подтверждаю ✓</div></div></div></div><button id="rp" onclick="rp()">↻ повторить</button></div>
<script>
function fit(){const k=innerWidth/1280;document.getElementById('s').style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
function rp(){const s=document.getElementById('s');s.style.animation='none';s.querySelectorAll('*').forEach(e=>{const a=e.style.animationName;e.style.animation='none';e.offsetHeight;e.style.animation=''});}
setInterval(rp,7000);
</script></body></html>
