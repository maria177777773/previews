<!-- concept: кружочки | approach: 12 лиц слетаются со всех сторон к заголовку | label: Слетаются -->
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
@font-face{font-family:"Golos Text";font-weight:700;src:url(../fonts/golos-text-cyrillic-700-normal-BKmY45Ip.woff2) format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:"Golos Text";font-weight:700;src:url(../fonts/golos-text-latin-600-normal-Bhk8uV1U.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
html,body{margin:0;background:#111;overflow:hidden}
#w{width:100vw;height:56.25vw;position:relative;overflow:hidden}
#s{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#E0457B;color:#fff;font:700 16px/1.1 "Golos Text",sans-serif}
#s *{box-sizing:border-box}
.ab{position:absolute}
.h{left:0;right:0;text-align:center;font-size:60px;line-height:1.08;letter-spacing:-.01em}
.c{border-radius:50%;overflow:hidden;background:#000}.c img{width:100%;height:100%;object-fit:cover;display:block}
#rp{position:absolute;right:14px;bottom:12px;z-index:9;font:600 13px "Golos Text";color:#fff;background:rgba(0,0,0,.45);border:0;border-radius:20px;padding:6px 14px;cursor:pointer}
.h{top:300px;font-size:58px}.h b{color:#fff;background:#16101a;padding:0 18px;border-radius:14px}
.f{width:120px;height:120px;border:5px solid #fff;animation:fly 1s cubic-bezier(.2,1.4,.4,1) both}
.f i{position:absolute}
@keyframes fly{from{transform:translate(var(--dx),var(--dy)) scale(.4);opacity:0}to{transform:none;opacity:1}}
.h{animation:hh .6s .2s both}@keyframes hh{from{opacity:0;transform:scale(.9)}}
</style></head><body><div id="w"><div id="s">
<div class="ab h">Персонал сам придёт<br>на <b>ваше мероприятие</b></div><div class="ab c f" style="left:580px;top:50px;--dx:0px;--dy:-700px;animation-delay:0.30s"><img src="../img/pam.jpg"></div><div class="ab c f" style="left:800px;top:83px;--dx:450px;--dy:-606px;animation-delay:0.39s"><img src="../img/p5.jpg"></div><div class="ab c f" style="left:961px;top:175px;--dx:779px;--dy:-350px;animation-delay:0.48s"><img src="../img/p9.jpg"></div><div class="ab c f" style="left:1020px;top:300px;--dx:900px;--dy:0px;animation-delay:0.57s"><img src="../img/p2.jpg"></div><div class="ab c f" style="left:961px;top:425px;--dx:779px;--dy:350px;animation-delay:0.66s"><img src="../img/p6.jpg"></div><div class="ab c f" style="left:800px;top:517px;--dx:450px;--dy:606px;animation-delay:0.75s"><img src="../img/p11.jpg"></div><div class="ab c f" style="left:580px;top:550px;--dx:0px;--dy:700px;animation-delay:0.84s"><img src="../img/p3.jpg"></div><div class="ab c f" style="left:360px;top:517px;--dx:-450px;--dy:606px;animation-delay:0.93s"><img src="../img/p8.jpg"></div><div class="ab c f" style="left:199px;top:425px;--dx:-779px;--dy:350px;animation-delay:1.02s"><img src="../img/p10.jpg"></div><div class="ab c f" style="left:140px;top:300px;--dx:-900px;--dy:0px;animation-delay:1.11s"><img src="../img/p4.jpg"></div><div class="ab c f" style="left:199px;top:175px;--dx:-779px;--dy:-350px;animation-delay:1.20s"><img src="../img/p7.jpg"></div><div class="ab c f" style="left:360px;top:83px;--dx:-450px;--dy:-606px;animation-delay:1.29s"><img src="../img/p12.jpg"></div></div><button id="rp" onclick="rp()">↻ повторить</button></div>
<script>
function fit(){const k=innerWidth/1280;document.getElementById('s').style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
function rp(){const s=document.getElementById('s');s.style.animation='none';s.querySelectorAll('*').forEach(e=>{const a=e.style.animationName;e.style.animation='none';e.offsetHeight;e.style.animation=''});}
setInterval(rp,6500);
</script></body></html>
