<!-- concept: история | approach: кружочки прыгают по дорожке к флажку «ваше мероприятие» | label: Идут к вам -->
<!doctype html><html lang="ru"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width">
<style>
@font-face{font-family:"Golos Text";font-weight:700;src:url(../fonts/golos-text-cyrillic-700-normal-BKmY45Ip.woff2) format('woff2');unicode-range:U+0400-04FF}
@font-face{font-family:"Golos Text";font-weight:700;src:url(../fonts/golos-text-latin-600-normal-Bhk8uV1U.woff2) format('woff2');unicode-range:U+0000-00FF,U+2000-206F}
html,body{margin:0;background:#111;overflow:hidden}
#w{width:100vw;height:56.25vw;position:relative;overflow:hidden}
#s{width:1280px;height:720px;position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden;background:#E0457B;color:#fff;font:700 16px/1.1 "Golos Text",sans-serif}
#s *{box-sizing:border-box}
.ab{position:absolute}
.h{left:0;right:0;text-align:center;font-size:60px;line-height:1.08;letter-spacing:-.01em}
.c{border-radius:50%;overflow:hidden;background:#000}.c img{width:100%;height:100%;object-fit:cover;display:block}
#rp{position:absolute;right:14px;bottom:12px;z-index:9;font:600 13px "Golos Text";color:#fff;background:rgba(0,0,0,.45);border:0;border-radius:20px;padding:6px 14px;cursor:pointer}
.h{top:60px}
.road{left:0;top:430px;width:1280px;height:8px;background:repeating-linear-gradient(90deg,#fff 0 30px,transparent 30px 52px);opacity:.6}
.pin{left:1040px;top:300px;width:200px;height:240px;text-align:center}
.pin .flag{background:#16101a;border-radius:24px;padding:22px 10px;font-size:26px;line-height:1.15}
.pin .flag:after{content:"";display:block;margin:0 auto}
.pin .st{width:6px;height:60px;background:#16101a;margin:0 auto}
.w{width:110px;height:110px;top:375px;border:5px solid #fff;animation:walk 3.2s cubic-bezier(.3,.1,.3,1) both}
.w:after{content:"";}
@keyframes walk{0%{left:-140px}100%{left:var(--x)}}
.w{animation-name:walk}
.hop{animation:hop .32s ease-in-out infinite alternate}@keyframes hop{to{transform:translateY(-14px)}}
</style></head><body><div id="w"><div id="s">
<div class="ab h">Персонал сам придёт</div><div class="ab road"></div><div class="ab pin"><div class="flag">Ваше<br>мероприятие</div><div class="st"></div></div><div class="ab c w" style="--x:930px;animation-delay:0.00s"><div class="c hop" style="width:100%;height:100%;animation-delay:0.00s"><img src="../img/pam.jpg"></div></div><div class="ab c w" style="--x:812px;animation-delay:0.22s"><div class="c hop" style="width:100%;height:100%;animation-delay:0.07s"><img src="../img/p5.jpg"></div></div><div class="ab c w" style="--x:694px;animation-delay:0.44s"><div class="c hop" style="width:100%;height:100%;animation-delay:0.14s"><img src="../img/p9.jpg"></div></div><div class="ab c w" style="--x:576px;animation-delay:0.66s"><div class="c hop" style="width:100%;height:100%;animation-delay:0.21s"><img src="../img/p2.jpg"></div></div><div class="ab c w" style="--x:458px;animation-delay:0.88s"><div class="c hop" style="width:100%;height:100%;animation-delay:0.28s"><img src="../img/p6.jpg"></div></div><div class="ab c w" style="--x:340px;animation-delay:1.10s"><div class="c hop" style="width:100%;height:100%;animation-delay:0.35s"><img src="../img/p11.jpg"></div></div><div class="ab c w" style="--x:222px;animation-delay:1.32s"><div class="c hop" style="width:100%;height:100%;animation-delay:0.42s"><img src="../img/p3.jpg"></div></div><div class="ab c w" style="--x:104px;animation-delay:1.54s"><div class="c hop" style="width:100%;height:100%;animation-delay:0.49s"><img src="../img/p8.jpg"></div></div></div><button id="rp" onclick="rp()">↻ повторить</button></div>
<script>
function fit(){const k=innerWidth/1280;document.getElementById('s').style.transform='scale('+k+')'}
addEventListener('resize',fit);fit();
function rp(){const s=document.getElementById('s');s.style.animation='none';s.querySelectorAll('*').forEach(e=>{const a=e.style.animationName;e.style.animation='none';e.offsetHeight;e.style.animation=''});}
setInterval(rp,6500);
</script></body></html>
