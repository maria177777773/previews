<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Громкий плакат</title>
<!-- concept: Громкий плакат | approach: плоская кинетическая типографика в цветах бренда: гигантские слова, заливки и хлёсткие перебивки | label: Громкий плакат -->
<link rel="stylesheet" href="base.css"><style>body{background:#FF2E93}</style></head><body>
<script src="engine.js"></script>
<script>
const {T,C,e:E,p,lerp,clamp,W,H}=U;
const crowd=U.crowd(110,11);
function man(c,x,y,s,col,o={}){c.save();c.translate(x,y);c.rotate(o.rot||0);c.scale(s*(o.sx||1),s*(o.sy||1));c.fillStyle=col;
 c.beginPath();c.arc(0,-62,20,0,7);c.fill();
 c.beginPath();c.moveTo(-30,0);c.lineTo(-30,-12);c.arc(0,-12,30,Math.PI,0);c.lineTo(30,0);c.closePath();c.fill();c.restore()}
function manFill(c,x,y,s,col,f,ghost){man(c,x,y,s,ghost);if(f<=0)return;c.save();c.beginPath();c.rect(x-40*s,y-84*s*f,80*s,84*s*f+2);c.clip();man(c,x,y,s,col);c.restore()}

function sceneA1(c,t){
 c.fillStyle=C.fux;c.fillRect(0,0,W,H);
 /* бегущая строка на фоне */
 c.save();c.globalAlpha=.16;const mq='ИВАН ЖМЁТ   ';c.font=U.font(330);c.fillStyle=C.wht;c.textBaseline='middle';
 const mw=c.measureText(mq).width;for(let i=-1;i<3;i++)c.fillText(mq,i*mw-(t*260)%mw,760);c.restore();
 U.kin(c,'Иван жмёт кнопку',90,120,64,p(t,.1,.9),{al:'left',col:C.wht});
 const fly=p(t,1.22,1.75),mor=E.io3(p(t,1.02,1.25));
 const bx=lerp(800,2100,E.in5(fly)),by=lerp(450,120,E.in3(fly));
 const w=lerp(1120,170,mor),h=lerp(190,170,mor),sc=E.back(p(t,.05,.6));
 const sq=U.hit(t,T.tap-.05,.5);
 /* хвост кометы */
 if(fly>0){c.save();c.strokeStyle=C.blk;c.lineCap='round';c.lineWidth=150;c.globalAlpha=.9;c.beginPath();c.moveTo(lerp(800,bx,.55),lerp(450,by,.55));c.lineTo(bx,by);c.stroke();
  c.strokeStyle=C.wht;c.lineWidth=60;c.globalAlpha=.5;c.beginPath();c.moveTo(lerp(800,bx,.2),lerp(450,by,.2)+80);c.lineTo(bx-200,by+80);c.stroke();c.restore()}
 c.save();c.translate(bx,by);c.rotate((1-sc)*-.4+sq*.02);c.scale(sc*(1+sq*.08),sc*(1-sq*.22));
 c.fillStyle=mor>.5?C.blk:C.blk;U.rr(c,-w/2+14,-h/2+18,w,h,h/2);c.fill();
 c.fillStyle=mor>.6?C.blk:C.wht;U.rr(c,-w/2,-h/2,w,h,h/2);c.fill();
 if(mor<1){c.save();U.rr(c,-w/2,-h/2,w,h,h/2);c.clip();const fs=U.fit(c,'Отправить запрос в Человеки',1000,48);U.txt(c,'Отправить запрос в Человеки',0,4,fs,{col:C.blk});c.restore()}
 c.restore();
 /* палец-курсор */
 const cu=E.out5(p(t,.45,.92)),cx=lerp(1500,1150,cu),cy=lerp(1000,520,cu),cs=1-.3*clamp(U.hit(t,T.tap-.06,.4))-p(t,1.15,1.3);
 if(cs>0){c.fillStyle=C.blk;c.beginPath();c.arc(cx,cy,46*cs,0,7);c.fill();c.strokeStyle=C.wht;c.lineWidth=8;c.beginPath();c.arc(cx,cy,46*cs,0,7);c.stroke()}
 /* круги от нажатия */
 for(let i=0;i<3;i++){const q=p(t,T.tap+i*.09,T.tap+.6+i*.09);if(q>0&&q<1){c.strokeStyle=C.wht;c.globalAlpha=1-q;c.lineWidth=14*(1-q);c.beginPath();c.arc(1150,520,60+E.out3(q)*380,0,7);c.stroke();c.globalAlpha=1}}
 U.kin(c,'Запрос улетел!',90,770,110,p(t,1.3,1.9),{al:'left',col:C.wht});
}
function sceneA2(c,t){
 c.fillStyle=C.blk;c.fillRect(0,0,W,H);
 const z=1+.07*p(t,1.5,5.4);c.save();c.translate(800,450);c.scale(z,z);c.rotate(-.012*p(t,1.5,5.4));c.translate(-800-30*p(t,1.5,5.4),-450);
 /* телефон */
 const ph=E.back(p(t,1.55,2.3));c.save();c.translate(330,470+(1-ph)*900);c.rotate(-.07+(1-ph)*.3);
 c.fillStyle=C.wht;U.rr(c,-195,-370,390,740,54);c.fill();c.fillStyle=C.pink;U.rr(c,-175,-350,350,700,38);c.fill();
 c.fillStyle=C.blk;U.rr(c,-50,-338,100,22,11);c.fill();
 U.txt(c,'Команда',-140,-262,40,{al:'left'});U.txt(c,'собирается',-140,-214,40,{al:'left',col:C.mal});
 const b=U.bar(t);c.fillStyle='rgba(17,17,17,.15)';U.rr(c,-140,-170,280,40,20);c.fill();
 if(b>0){c.fillStyle=C.mal;U.rr(c,-140,-170,Math.max(40,280*b),40,20);c.fill()}
 for(let k=0;k<10;k++){const f=U.fill(k,t),col=k<6?C.fux:C.blk,gx=-112+(k%4)*75+(k>=8?75:0)*0+(k<6?0:0),row=k<4?0:k<6?1:k<10?2:3;
  const xx=k<4?-112+k*75:k<6?-112+(k-4)*75:-112+(k-6)*75,yy=k<4?10:k<6?130:270;
  manFill(c,xx,yy+ -U.hit(t,T.fill0+(T.fill1-T.fill0)*(k/10*.82+.2),.5)*14,.82,col,E.out3(f),'rgba(17,17,17,.14)')}
 c.restore();
 /* гигантские 6 и 4 */
 const rows=[{n:'6',lab:'промо-моделей',from:0,cnt:6,y:285,col:C.fux},{n:'4',lab:'аниматора',from:6,cnt:4,y:650,col:C.pink}];
 rows.forEach((r,ri)=>{const inn=E.out5(p(t,1.8+ri*.18,2.5+ri*.18)),ox=(1-inn)*1200;
  let g=0;for(let k=r.from;k<r.from+r.cnt;k++)g+=E.out3(U.fill(k,t));g/=r.cnt;
  c.save();c.translate(ox,0);
  U.txt(c,r.n,760,r.y,330,{col:null,stroke:C.wht,lw:6});
  c.save();c.beginPath();c.rect(600,r.y+150-300*g,330,300*g);c.clip();U.txt(c,r.n,760,r.y,330,{col:r.col});c.restore();
  U.txt(c,r.lab,930,r.y-95,58,{al:'left',col:C.wht});
  for(let i=0;i<r.cnt;i++){const k=r.from+i,f=U.fill(k,t),e=E.back(p(f,.25,1));
   man(c,975+i*104,r.y+105,1.15,'rgba(255,255,255,.16)');
   if(e>0)man(c,975+i*104,r.y+105,1.15*e,r.col,{rot:(1-e)*-.8,sy:1+U.hit(f,.9,.4)*.2})}
  c.restore()});
 c.restore();
}
function sceneDone(c,t){
 const q=E.io3(p(t,5.2,5.75));if(q<=0)return;
 c.save();c.beginPath();c.arc(330,300,q*1900,0,7);c.clip();c.fillStyle=C.mal;c.fillRect(0,0,W,H);
 U.kin(c,'Команда',800,270,190,p(t,5.3,5.9),{col:C.wht});U.kin(c,'собрана!',800,480,190,p(t,5.45,6.05),{col:C.pink});
 for(let i=0;i<10;i++){const e=E.back(p(t,5.4+i*.04,5.8+i*.04)),j=Math.abs(Math.sin((t-5.5)*7-i*.55))*46*p(t,5.7,5.9);
  man(c,350+i*100,860-j+(1-e)*300,1.25,i<6?C.wht:C.pink,{sy:1+j/300})}
 c.restore();
}
function sceneB(c,t){
 const camY=E.io5(p(t,T.hero0,11.15))*640,sh=U.hit(t,T.stamp,.45)*16;
 c.fillStyle=C.pink;c.fillRect(0,0,W,H);
 c.save();c.translate(sh,-camY+sh*.6);
 const cx=800,top=330,FH=430,FW=430;
 /* слова слева */
 const sw=p(t,8.5,8.9);
 c.save();c.beginPath();c.rect(0,440,700,260);c.clip();
 c.save();c.translate(0,-E.io5(sw)*260);U.kin(c,'Сотни',60,520,88,p(t,6.8,7.3),{al:'left'});U.kin(c,'на входе',60,620,U.fit(c,'на входе',470,88),p(t,6.95,7.5),{al:'left',col:C.mal});
 c.translate(0,260);U.txt(c,'Отбираем',60,520,U.fit(c,'Отбираем',470,88),{al:'left'});U.txt(c,'лучших',60,620,88,{al:'left',col:C.mal});c.restore();c.restore();
 /* воронка */
 c.strokeStyle=C.blk;c.lineWidth=28;c.lineCap='round';
 c.beginPath();c.moveTo(cx-FW-10,top);c.lineTo(cx-FW*.13-10,top+FH);c.moveTo(cx+FW+10,top);c.lineTo(cx+FW*.13+10,top+FH);c.stroke();
 const names=['Портфолио','Обучение','Экзамен'];
 names.forEach((nm,s)=>{const y=top+U.stY[s]*FH,hw=U.fw(U.stY[s])*FW,pu=U.stPulse(s,t),on=E.back(U.stOn(s,t));
  c.strokeStyle=C.fux;c.lineWidth=6+pu*14;c.beginPath();c.moveTo(cx-hw+8,y);c.lineTo(cx+hw-8,y);c.stroke();
  if(on>0){c.save();c.translate(cx+hw+70+(1-on)*600,y);c.rotate((1-on)*.2);
   c.fillStyle=C.blk;c.beginPath();c.arc(0,0,26*(1+pu*.25),0,7);c.fill();c.strokeStyle=C.wht;c.lineWidth=7;c.lineJoin='round';c.beginPath();c.moveTo(-11,1);c.lineTo(-3,10);c.lineTo(12,-9);c.stroke();
   U.txt(c,nm,44,2,54,{al:'left'});c.restore()}});
 /* толпа */
 crowd.forEach(m=>{const q=U.fpos(m,t);if(q.a<=0)return;const drop=(1-E.bounce(p(t,6.55+m.d*.5,7.1+m.d*.5)))*-560;
  const x=cx+q.x*FW,y=top+q.y*FH+(q.st==='wait'?drop:0);c.globalAlpha=q.a;
  if(m.cat){U.cat(c,x,y+14,.62,C.blk,t,C.fux);if(q.st==='rej')U.txt(c,'Мяу!',x+60,y-70,40,{col:C.mal})}
  else man(c,x,y+16,.42,q.st==='rej'?C.wht:m.c===0?C.mal:C.blk,{rot:q.rot});c.globalAlpha=1});
 /* герой */
 const h=p(t,T.hero0,11.15);
 if(h>0){const e=E.io3(h),hx=lerp(800,560,e),hy=lerp(790,1440,e),hs=lerp(.42,4.5,e);
  const bg=E.back(p(t,10.85,11.3));c.fillStyle=C.fux;c.beginPath();c.arc(560,1250,330*bg,0,7);c.fill();
  U.cat(c,225,1440,1.5*E.back(p(t,11.7,12.1)),C.blk,t,C.fux);
  man(c,hx,hy,hs,C.blk,{sy:1-U.hit(t,T.stamp,.5)*.12,sx:1+U.hit(t,T.stamp,.5)*.08});
  /* лучи и знак */
  const st=p(t,11.15,T.stamp),ry=p(t,T.stamp,11.9);
  if(ry>0&&ry<1){c.strokeStyle=C.blk;c.lineWidth=14*(1-ry);for(let i=0;i<14;i++){const a=i/14*6.283,r1=150+E.out3(ry)*150,r2=r1+90*(1-ry);c.beginPath();c.moveTo(600+Math.cos(a)*r1,1320+Math.sin(a)*r1);c.lineTo(600+Math.cos(a)*r2,1320+Math.sin(a)*r2);c.stroke()}}
  if(st>0){const s=lerp(3.4,1,E.in3(st))*(1+U.hit(t,T.stamp,.4)*.12);c.save();c.translate(600,1320);c.rotate(lerp(-.7,-.12,E.out3(st)));c.scale(s,s);c.globalAlpha=clamp(st*3);
   c.fillStyle=C.wht;c.beginPath();c.arc(0,0,128,0,7);c.fill();c.strokeStyle=C.fux;c.lineWidth=12;c.beginPath();c.arc(0,0,118,0,7);c.stroke();U.drawLogo(c,0,0,196);c.restore()}
  U.kin(c,'Знак',930,1150,150,p(t,11.45,11.9),{al:'left'});U.kin(c,'качества',930,1300,U.fit(c,'качества',620,150),p(t,11.55,12.1),{al:'left',col:C.mal});
  const tg=E.out5(p(t,11.9,12.3));c.globalAlpha=tg;U.txt(c,'Портфолио, обучение, экзамен',930+(1-tg)*80,1410,36,{al:'left',f:'bold'});c.globalAlpha=1}
 c.restore();
}
U.stage((c,t)=>{
 if(t<2.05)sceneA1(c,t);
 if(t>=1.5&&t<6.9){const q=E.io5(p(t,1.5,2.05));c.save();c.beginPath();c.moveTo(W+200-q*2200,0);c.lineTo(W+400,0);c.lineTo(W+400,H);c.lineTo(W+500-q*2200,H);c.closePath();c.clip();sceneA2(c,t);sceneDone(c,t);c.restore();
  if(q<1){c.fillStyle=C.wht;c.beginPath();c.moveTo(W+200-q*2200,0);c.lineTo(W+240-q*2200,0);c.lineTo(W+540-q*2200,H);c.lineTo(W+500-q*2200,H);c.fill()}}
 if(t>=6.4){const q=E.io5(p(t,6.4,6.9)),q2=E.io5(p(t,6.34,6.84));
  if(q<1){c.fillStyle=C.fux;c.fillRect(0,H-q2*H-80,W,H+80)}
  c.save();c.beginPath();c.rect(0,H-q*H,W,H);c.clip();sceneB(c,t);c.restore()}
 if(t>=T.out){const q=E.io5(p(t,T.out,T.D));c.fillStyle=C.blk;c.fillRect(0,0,W*E.io5(p(t,T.out-.06,T.D-.06)),H);c.fillStyle=C.fux;c.fillRect(0,0,W*q,H)}
});
</script></body></html>
