<!doctype html><html lang="ru"><head><meta charset="utf-8"><title>Мягкий пластилин</title>
<!-- concept: Мягкий пластилин | approach: объёмные пухлые человечки-фасолинки: всё пружинит, сплющивается и надувается, как в детском 3D-мультике | label: Мягкий пластилин -->
<link rel="stylesheet" href="base.css"><style>body{background:#FFD9EA}</style></head><body>
<script src="engine.js"></script>
<script>
const {T,C,e:E,p,lerp,clamp,W,H}=U;
const crowd=U.crowd(90,57),BX=2600,SKIN='#FFE6F1';
const hx=h=>[parseInt(h.slice(1,3),16),parseInt(h.slice(3,5),16),parseInt(h.slice(5,7),16)];
const mix=(a,b,t)=>{const x=hx(a),y=hx(b);return`rgb(${x.map((v,i)=>Math.round(v+(y[i]-v)*t)).join(',')})`};
function sphere(c,x,y,r,col){const g=c.createRadialGradient(x-r*.35,y-r*.42,r*.08,x,y,r);g.addColorStop(0,mix(col,'#ffffff',.6));g.addColorStop(.55,col);g.addColorStop(1,mix(col,'#000000',.3));c.fillStyle=g;c.beginPath();c.arc(x,y,r,0,7);c.fill()}
function shadow(c,x,y,rx,a=.24){c.save();c.translate(x,y);c.scale(1,.28);const g=c.createRadialGradient(0,0,rx*.2,0,0,rx);g.addColorStop(0,`rgba(150,10,80,${a})`);g.addColorStop(1,'rgba(150,10,80,0)');c.fillStyle=g;c.beginPath();c.arc(0,0,rx,0,7);c.fill();c.restore()}
function pill(c,x,y,w,h,r,col,dep=10){c.fillStyle=mix(col,'#000000',.32);U.rr(c,x,y+dep,w,h,r);c.fill();const g=c.createLinearGradient(0,y,0,y+h);g.addColorStop(0,mix(col,'#ffffff',.38));g.addColorStop(.45,col);g.addColorStop(1,mix(col,'#000000',.12));c.fillStyle=g;U.rr(c,x,y,w,h,r);c.fill();
 c.strokeStyle='rgba(255,255,255,.55)';c.lineWidth=3;c.beginPath();c.moveTo(x+r*.8,y+5);c.lineTo(x+w-r*.8,y+5);c.stroke()}
function bean(c,x,y,s,col,o={}){const sq=o.sq||0;c.save();c.translate(x,y);c.rotate(o.rot||0);c.scale(s*(1+sq*.3),s*(1-sq*.3));
 const g=c.createLinearGradient(-30,0,30,0);g.addColorStop(0,mix(col,'#ffffff',.38));g.addColorStop(.45,col);g.addColorStop(1,mix(col,'#000000',.32));c.fillStyle=g;U.rr(c,-29,-76,58,76,27);c.fill();
 sphere(c,0,-96,27,o.skin||SKIN);
 if(o.hat){c.fillStyle=o.hat;c.beginPath();c.moveTo(-17,-116);c.quadraticCurveTo(0,-176,4,-170);c.quadraticCurveTo(10,-150,19,-114);c.closePath();c.fill();sphere(c,4,-170,7,'#ffffff')}
 const bl=Math.sin((o.t||0)*1.7+(o.id||0)*2)>.985;c.fillStyle=C.blk;c.beginPath();c.ellipse(-9,-97,3.6,bl?.8:4.4,0,0,7);c.ellipse(9,-97,3.6,bl?.8:4.4,0,0,7);c.fill();
 c.fillStyle='rgba(255,46,147,.35)';c.beginPath();c.arc(-17,-88,5,0,7);c.arc(17,-88,5,0,7);c.fill();
 if(o.smile){c.strokeStyle=C.blk;c.lineWidth=2.6;c.lineCap='round';c.beginPath();c.arc(0,-90,7,.25,Math.PI-.25);c.stroke()}
 c.restore()}
const mkSpr=col=>{const g=document.createElement('canvas');g.width=90;g.height=150;const x=g.getContext('2d');x.translate(45,146);bean(x,0,0,1.1,col);return g};
const SPR=[C.blk,C.fux,'#ffffff','#FF8FC4'].map(mkSpr),SPG=mkSpr('#D9C3CE');
const K=[[0,470,580,1.85],[1.0,470,580,1.9],[2.1,800,450,1],[5.2,800,450,1.04],[6.4,800,450,1],[7.3,BX,450,1],[10.4,BX,450,1.02],[11.2,BX+600,600,1.5],[12.6,BX+600,600,1.55],[13,470,580,1.85]];
function cam(t){let i=0;while(i<K.length-2&&t>=K[i+1][0])i++;const a=K[i],b=K[i+1],q=E.io5(p(t,a[0],b[0]));return[lerp(a[1],b[1],q),lerp(a[2],b[2],q),lerp(a[3],b[3],q)]}
const slot=k=>k<6?[470-118+(k%3)*118,k<3?455:600]:[470-141+(k-6)*94,765];
function ballAt(u){if(u<.3){const v=u/.3;return[lerp(470,770,v),lerp(580,800,v*v)-Math.sin(v*Math.PI)*70]}if(u<.6){const v=(u-.3)/.3;return[lerp(770,980,v),800-Math.sin(v*Math.PI)*240]}const v=(u-.6)/.4;return[lerp(980,1230,v),lerp(800,450,v)-Math.sin(v*Math.PI)*250]}

function phone(c,t){const st=t>12.5?0:t,bob=Math.sin(t*1.6)*5;
 shadow(c,470,872,330,.3);
 c.save();c.translate(470,470+bob);c.rotate(Math.sin(t*1.1)*.008);
 pill(c,-225,-385,450,770,60,'#2a2a2a',14);
 const g=c.createLinearGradient(0,-360,0,360);g.addColorStop(0,'#ffffff');g.addColorStop(1,'#FFEAF3');c.fillStyle=g;U.rr(c,-200,-358,400,716,40);c.fill();
 c.save();U.rr(c,-200,-358,400,716,40);c.clip();
 const pg=E.back(p(st,1.15,1.8));
 if(pg<.999){c.save();c.translate(0,-Math.max(0,pg)*760);
  U.txt(c,'Корпоратив',-168,-292,34,{al:'left'});U.txt(c,'на 100 человек',-168,-250,26,{al:'left',col:C.mal,f:'bold'});
  ['Шатры','Обогреватели','Сцена'].forEach((s,i)=>{pill(c,-170,-205+i*70,340,52,22,'#FFD3E8',5);U.txt(c,s,-146,-177+i*70,24,{al:'left',f:'bold'})});
  const pr=clamp(p(st,T.tap-.1,T.tap))*(1-E.elastic(p(st,T.tap,T.tap+.5))),out=E.in3(p(st,1.05,1.2));
  c.save();c.translate(0,110+pr*14);c.scale((1+pr*.1)*(1-out),(1-pr*.42)*(1-out));pill(c,-178,-60,356,120,60,C.fux,16*(1-pr));U.txt(c,'Отправить запрос',0,-19,27,{col:C.wht});U.txt(c,'в Человеки',0,21,27,{col:C.wht});c.restore();
  c.restore()}
 if(pg>0){c.save();c.translate(0,(1-pg)*760);
  U.txt(c,'Команда',-168,-300,36,{al:'left'});U.txt(c,st<5.2?'собирается':'собрана!',-168,-258,36,{al:'left',col:C.mal});
  const b=U.bar(st);c.fillStyle='#F3CADB';U.rr(c,-170,-222,340,34,17);c.fill();c.fillStyle='rgba(120,10,60,.12)';U.rr(c,-170,-222,340,12,6);c.fill();
  if(b>0){const w=Math.max(34,340*b)+U.hit(st*1,T.fill1,.5)*10;pill(c,-170,-222,w,34,17,C.fux,0);sphere(c,-170+w-17,-205,17,C.fux)}
  U.txt(c,'Промо-модели',-168,-158,22,{al:'left',f:'bold'});U.txt(c,U.cnt(st,0,6)+' из 6',168,-158,22,{al:'right',col:C.mal,f:'bold'});
  U.txt(c,'Аниматоры',-168,170,22,{al:'left',f:'bold'});U.txt(c,U.cnt(st,6,4)+' из 4',168,170,22,{al:'right',col:C.mal,f:'bold'});
  for(let k=0;k<10;k++){const s=slot(k);c.fillStyle='rgba(150,10,80,.13)';c.beginPath();c.ellipse(s[0]-470,s[1]-470,k<6?40:33,k<6?13:11,0,0,7);c.fill()}
  c.restore()}
 c.restore();c.restore();
 /* палец */
 if(st<1.5){const u=E.out5(p(st,.4,.94)),out=E.in3(p(st,1.08,1.5)),x=lerp(980,560,u)+out*600,y=lerp(1150,650,u)+out*500+clamp(p(st,T.tap-.1,T.tap))*(1-p(st,T.tap,T.tap+.15))*12;
  c.save();c.translate(x,y);c.rotate(-.6);pill(c,-34,-10,68,420,34,'#ffffff',0);sphere(c,0,0,34,'#ffffff');c.restore()}
}
function pod(c,t){const st=t>12.5?0:t;let w=U.hit(st,T.fly1-.02,.8)*.14;for(let k=0;k<10;k++)w+=U.hit(U.fill(k,st),.01,.3)*.05;
 shadow(c,1230,818,300,.3);c.save();c.translate(1230,810);c.scale(1+w,1-w);
 const g=c.createRadialGradient(-80,-300,20,0,-190,330);g.addColorStop(0,'#ffffff');g.addColorStop(.6,'#FFF3F8');g.addColorStop(1,'#F0B9D2');c.fillStyle=g;U.rr(c,-200,-380,400,380,180);c.fill();
 c.fillStyle='#8f0c40';c.beginPath();c.ellipse(0,-362,82,24,0,0,7);c.fill();c.fillStyle=C.fux;c.beginPath();c.ellipse(0,-362,96,30,0,0,7);c.ellipse(0,-362,80,22,0,0,7);c.fill('evenodd');
 U.drawLogo(c,0,-175,290);c.restore()}

function sceneA(c,t){const st=t>12.5?0:t;
 pod(c,t);phone(c,t);
 /* шарик-запрос скачет в домик */
 const fl=p(st,1.08,T.fly1);if(fl>0&&fl<1){const q=ballAt(fl),sq=Math.max(clamp(1-Math.abs(fl-.3)/.05),clamp(1-Math.abs(fl-.6)/.05)),sc=1-E.in3(p(fl,.93,1));
  shadow(c,q[0],820,50*(1-(820-q[1])/900));c.save();c.translate(q[0],q[1]);c.scale((1+sq*.4)*sc,(1-sq*.4)*sc);sphere(c,0,-38*(1-sq*.4)+sq*20,38,C.fux);c.restore()}
 /* фасолинки-люди прыгают из домика в телефон и надуваются */
 if(st>T.fill0&&t<7.4)for(let k=0;k<10;k++){const f=U.fill(k,st);if(f<=0)continue;const u=E.io3(p(f,0,.7)),s=slot(k),bs=k<6?.78:.66;
  const x=lerp(1230,s[0],u),jump=Math.abs(Math.sin((st-5.3)*7-k*.6))*30*p(st,5.3,5.5),y=lerp(450,s[1],u)-Math.sin(u*Math.PI)*(300-k*8)-jump+Math.sin(t*1.6)*5*u;
  const infl=f<.7?lerp(.35,.6,u):.6+.4*E.elastic(p(f,.7,1));
  bean(c,x,y,bs*infl,k<6?C.fux:'#1c1c1c',{sq:U.hit(f,.7,.3)*.9+jump/400*-1,rot:(1-u)*Math.sin(u*9+k)*.5,hat:k<6?null:C.fux,t,id:k,smile:f>=1})}
 /* конфетти-шарики на «собрана» */
 const cf=p(st,5.25,6.4);if(cf>0&&cf<1)for(let i=0;i<26;i++){const a=-Math.PI/2+(U.noise(i,4)-.5)*2.2,v=500+U.noise(i,5)*700,x=1230+Math.cos(a)*v*cf,y=450+Math.sin(a)*v*cf+900*cf*cf;sphere(c,x,y,10+U.noise(i,6)*12,[C.fux,C.mal,'#ffffff','#1c1c1c'][i%4])}
}
function sceneB(c,t){const cx=BX,top=300,FH=430,FW=390;
 shadow(c,cx,835,330,.25);
 /* задняя кромка */
 c.fillStyle='#C97FA2';c.beginPath();c.ellipse(cx,top,FW+22,40,0,0,7);c.fill();c.fillStyle='#8f0c40';c.beginPath();c.ellipse(cx,top+6,FW-6,30,0,0,7);c.fill();
 const draw=front=>crowd.forEach(m=>{const q=U.fpos(m,t);if(q.a<=0)return;const isF=q.st!=='fall'||q.y<.03;if(isF!==front)return;const drop=(1-E.bounce(p(t,6.8+m.d*.6,7.4+m.d*.6)))*-700;
  const x=cx+q.x*FW,y=top+q.y*FH+14+(q.st==='wait'?drop:0),s=.36*(q.st==='rej'?clamp(1.2-q.k*.5):1);c.save();c.globalAlpha=q.a;c.translate(x,y);
  if(m.cat){U.cat(c,0,0,.55,'#1c1c1c',t,C.fux);if(q.st==='rej'){pill(c,26,-104,112,44,22,'#ffffff',4);U.txt(c,'Мяу!',82,-81,24,{col:C.mal})}}
  else{c.rotate(q.rot*.7);c.drawImage(q.st==='rej'?SPG:SPR[m.c],-45*s/1.1,-146*s/1.1,90*s/1.1,150*s/1.1)}c.restore()});
 draw(false);
 /* тело воронки */
 const g=c.createLinearGradient(cx-FW,0,cx+FW,0);g.addColorStop(0,'#ffffff');g.addColorStop(.35,'#FFF1F7');g.addColorStop(1,'#E9A9C6');c.fillStyle=g;
 c.beginPath();c.moveTo(cx-FW-22,top);c.quadraticCurveTo(cx,top+78,cx+FW+22,top);c.lineTo(cx+FW*.13+16,top+FH);c.quadraticCurveTo(cx,top+FH+26,cx-FW*.13-16,top+FH);c.closePath();c.fill();
 ['Портфолио','Обучение','Экзамен'].forEach((nm,s)=>{const y=top+U.stY[s]*FH+18,hw=U.fw(U.stY[s])*FW,pu=U.stPulse(s,t),on=U.stOn(s,t),sq=1-pu*.16*(.5+.5*Math.sin(t*16));
  c.save();c.translate(cx,y);c.scale(sq,1+pu*.25);const gg=c.createLinearGradient(-hw,0,hw,0);gg.addColorStop(0,mix(C.fux,'#ffffff',.45));gg.addColorStop(.4,C.fux);gg.addColorStop(1,C.mal);c.strokeStyle=gg;c.lineWidth=30;c.lineCap='round';
  c.beginPath();c.moveTo(-hw-8,-8);c.quadraticCurveTo(0,26,hw+8,-8);c.stroke();c.restore();
  const e=E.elastic(on);if(on>0){c.save();c.translate(cx-hw-70,y);c.scale(e,e);pill(c,-330,-38,330,76,38,'#ffffff',8);U.txt(c,nm,-150,2,U.fit(c,nm,210,32),{});sphere(c,-292,0,24,pu>.1||on>=1?C.fux:'#D9C3CE');
   c.strokeStyle=C.wht;c.lineWidth=5;c.lineCap='round';c.lineJoin='round';c.beginPath();c.moveTo(-302,1);c.lineTo(-294,9);c.lineTo(-281,-7);c.stroke();c.restore()}});
 draw(true);
 /* герой на подиуме */
 const h=p(t,T.hero0,11.15),px=BX+400;
 shadow(c,px,842,200,.3);pill(c,px-150,790,300,50,25,C.wht,14);
 U.cat(c,px+330,842,1.35,'#1c1c1c',t,C.fux);
 if(h>0){const u=E.io3(h),x=lerp(cx,px,u),y=lerp(top+FH+40,792,u)-Math.sin(u*Math.PI)*210,st=U.hit(t,T.stamp,.6),land=U.hit(t,11.15,.5);
  bean(c,x,y,lerp(.36,2.2,E.out3(h)),C.mal,{sq:(h<1?-.25*Math.sin(u*Math.PI):0)+land*.5+st*.25,t,id:3,smile:true,rot:(1-u)*-.6});
  const sp=p(t,11.15,T.stamp);if(sp>0){const dy=(1-E.in3(sp))*-700,wob=E.elastic(p(t,T.stamp,T.stamp+.7));c.save();c.translate(x,y-116+dy);c.rotate(Math.sin(t*2.5)*.05*(sp>=1?1:4));
   c.strokeStyle=C.fux;c.lineWidth=16;c.lineCap='round';c.beginPath();c.moveTo(-34,-100);c.lineTo(0,-10);c.lineTo(34,-100);c.stroke();
   c.scale(1+(1-wob)*.5,1-(1-wob)*.3);sphere(c,0,0,74,C.fux);c.fillStyle=C.wht;c.beginPath();c.arc(0,0,58,0,7);c.fill();U.drawLogo(c,0,1,96);c.restore()}
  /* искры */
  const sk=p(t,T.stamp,12.6);if(sk>0)for(let i=0;i<9;i++){const a=i/9*6.283+.3,r=120+E.out3(clamp(sk*2.5))*170,tw=.5+.5*Math.sin(t*9+i*2),s=(10+i%3*7)*tw*(1-p(t,12.4,12.6));c.fillStyle=i%2?C.wht:C.fux;c.save();c.translate(x+Math.cos(a)*r,y-150+Math.sin(a)*r*.8);c.beginPath();c.moveTo(0,-s*2);c.quadraticCurveTo(0,0,s*2,0);c.quadraticCurveTo(0,0,0,s*2);c.quadraticCurveTo(0,0,-s*2,0);c.quadraticCurveTo(0,0,0,-s*2);c.fill();c.restore()}}
}
const blobs=[];{const r=U.rng(9);for(let i=0;i<14;i++)blobs.push([r()*5200-600,r()*900,120+r()*260,.15+r()*.5,r()*6])}
U.stage((c,t)=>{
 const cm=cam(t),shk=U.hit(t,T.stamp,.4)*7;
 const bg=c.createLinearGradient(0,0,0,H);bg.addColorStop(0,'#FFE6F1');bg.addColorStop(1,'#FFB9DA');c.fillStyle=bg;c.fillRect(0,0,W,H);
 blobs.forEach(b=>{const x=((b[0]-cm[0]*b[3])%2600+2600)%2600-500,y=b[1]+Math.sin(t*.6+b[4])*24,g=c.createRadialGradient(x,y,0,x,y,b[2]);g.addColorStop(0,'rgba(255,255,255,.55)');g.addColorStop(1,'rgba(255,255,255,0)');c.fillStyle=g;c.fillRect(x-b[2],y-b[2],b[2]*2,b[2]*2)});
 c.save();c.translate(800,450+shk);c.scale(cm[2],cm[2]);c.translate(-cm[0],-cm[1]);
 const fg=c.createLinearGradient(0,790,0,1100);fg.addColorStop(0,'#FFA6CF');fg.addColorStop(1,'#FF8FC4');c.fillStyle=fg;U.rr(c,-3000,800,10000,900,0);c.fillRect(-3000,812,10000,900);
 if(cm[0]<1900||t>12.6)sceneA(c,t);
 if(cm[0]>1000&&t<12.97)sceneB(c,t);
 c.restore();
 U.title(c,t,['Иван','жмёт кнопку'],40,110,56,.15,1.15,{max:330});
 U.title(c,t,['Запрос','улетел!'],720,100,84,1.45,2.7);
 U.title(c,t,['Команда','собрана!'],720,100,92,5.3,6.4,{max:820});
 U.title(c,t,['Сотни','на входе'],1130,470,76,7.25,8.4,{max:440});U.title(c,t,['Отбираем','лучших'],1130,470,76,8.65,10.3,{max:440});
 U.title(c,t,['Знак','качества'],790,300,110,11.5,12.55,{max:740});
 const tg=E.out5(p(t,11.95,12.35))*(1-p(t,12.5,12.65));if(tg>0){c.globalAlpha=tg;U.txt(c,'Портфолио, обучение, экзамен',790,560,34,{al:'left',f:'bold'});c.globalAlpha=1}
});
