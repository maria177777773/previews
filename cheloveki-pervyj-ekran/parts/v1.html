<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@700;900&family=Golos+Text:wght@400;600;700&display=swap&subset=cyrillic" rel="stylesheet">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{--malina:#C20D52;--fuchsia:#FF2E93;--baby:#FFC2E0;--blush:#FFE3F0;--ink:#111}
body{font-family:'Golos Text',sans-serif;color:var(--ink);background:#fff;overflow:hidden}
.nav{height:72px;background:#FFC2E0;border-bottom:1px solid #f3a9cc;position:relative;z-index:30}
.nav .w{max-width:1240px;margin:0 auto;padding:0 32px;height:100%;display:flex;align-items:center;gap:28px}
.nav img{height:30px}.nav a{color:var(--ink);text-decoration:none;font-weight:600;font-size:16px}.nav .sp{flex:1}
.btn{display:inline-flex;align-items:center;justify-content:center;min-width:280px;height:64px;padding:0 28px;border-radius:40px;font:700 18px 'Golos Text';text-decoration:none}
.nav .btn{min-width:0;height:46px;font-size:16px}
.pri{background:var(--ink);color:#fff}.sec{background:#fff;color:var(--ink)}
.hero{position:relative;overflow:hidden;height:788px;background:linear-gradient(var(--malina) 0 72%,var(--fuchsia) 72% 100%);color:var(--baby)}
.w{max-width:1240px;margin:0 auto;padding:0 32px;position:relative;height:100%}
.col{display:flex;flex-direction:column;height:100%}
.top{display:flex;justify-content:space-between;font:500 14px/1 monospace;letter-spacing:.18em;text-transform:uppercase;padding-top:30px}
h1{font-family:'Unbounded';font-weight:900;line-height:1;letter-spacing:-.01em;font-size:min(calc((100vw - 80px)/6.9),170px);text-align:center;margin-top:18px;white-space:nowrap;animation:rise .9s cubic-bezier(.2,.8,.2,1) both}
.sub{text-align:center;color:#fff;font-size:21px;margin-top:8px;animation:rise .9s .2s both}
.crowd{display:flex;justify-content:center;align-items:flex-end;position:relative;z-index:5}
.crowd img{height:330px;display:block;animation:pop .7s cubic-bezier(.2,1.4,.4,1) both;transform-origin:bottom}
.crowd img:nth-child(1){animation-delay:.45s}.crowd img:nth-child(2){animation-delay:.57s}.crowd img:nth-child(3){animation-delay:.69s}.crowd img:nth-child(4){animation-delay:.81s}.crowd img:nth-child(5){animation-delay:.93s}.crowd img:nth-child(6){animation-delay:1.05s}
.cta{display:flex;gap:16px;justify-content:center}
@keyframes rise{from{opacity:0;transform:translateY(40px)}to{opacity:1;transform:none}}
@keyframes pop{from{opacity:0;transform:translateY(90px)}to{opacity:1;transform:none}}
@keyframes mq{to{transform:translateX(-50%)}}
.tick{background:var(--ink);color:#fff;white-space:nowrap;overflow:hidden;position:relative;z-index:25}
.tick div{display:inline-block;padding:10px 0;font-weight:600;font-size:16px;animation:mq 40s linear infinite}

.stage{position:relative;margin-top:auto}
.lab{position:absolute;top:-6px;transform:translateX(-50%);display:flex;flex-direction:column;align-items:center;z-index:8;animation:rise .6s both}
.lab span{background:#fff;color:#111;font-weight:700;font-size:17px;padding:8px 16px;border-radius:30px;transform:rotate(-3deg)}
.lab:nth-child(even) span{transform:rotate(3deg);background:var(--ink);color:#fff}
.crowd{padding-top:92px}.cta{padding:22px 0 26px}
</style></head><body>
<nav class="nav"><div class="w"><img src="https://maria177777773.github.io/previews/cheloveki-lending/img/logo-l4.svg" alt="Человеки"><a>О нас</a><a>Как работает</a><a>Цены</a><a>Проверка</a><a>Партнёрам</a><a>Контакты</a><span class="sp"></span><a class="btn pri">Заказать персонал</a></div></nav>

<svg width="60" height="54" viewBox="0 0 60 54"><path d="M30 2 C 12 16, 44 30, 30 50" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/><path d="M21 42 L30 51 L38 41" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lab" style="left:73%;animation-delay:1.9s"><span>фотографы</span>
<svg width="60" height="54" viewBox="0 0 60 54"><path d="M30 2 C 48 16, 16 30, 30 50" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round"/><path d="M21 42 L30 51 L38 41" fill="none" stroke="#111" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/></svg></div><div class="lab" style="left:90%;animation-delay:2.05s"><span>ведущие</span>
