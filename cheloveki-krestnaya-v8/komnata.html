<h1>Вместо кадра с досье: комната</h1><p>Кадр идёт после стука в дверь, перед тем как кресло разворачивается.</p><figure><img src="k-o-dver.jpg"><figcaption>1. От двери: спинка кресла к нам, над ней поднимается дым, свисает хвост кота. Я за него: дальше кресло разворачивается, и мы впервые видим её</figcaption></figure><figure><img src="k-o-potolok.jpg"><figcaption>2. Сверху из угла: рука с перстнем и мундштуком на подлокотнике, дым идёт вверх к нам</figcaption></figure><figure><img src="k-o-silujet.jpg"><figcaption>3. Сбоку против окна: она тёмным силуэтом с котом, выдыхает дым, лица не видно</figcaption></figure></main></body></html>
