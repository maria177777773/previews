<h1>«Без уважения»: плавный переход</h1>
<p>Клип начинается ровно с последнего кадра прошлой сцены (Настя снизу). Камера плавно поднимается и подъезжает к ней. Клип кончается одним из 4 кадров ниже.</p>
<h2>Начало: конец прошлой сцены</h2><figure class="s"><img src="k-niz-konec.jpg"></figure>
<h2>Конец: выбери 1 из 4</h2><figure><img src="k-e-fas-krupno.jpg"><figcaption>1. Фас крупно: лицо на весь кадр, глаза в объектив. Самый жёсткий вариант, я за него</figcaption></figure><figure><img src="k-e-fas-sredniy.jpg"><figcaption>2. Фас средний: видно кресло и кота, она чуть подаётся вперёд</figcaption></figure><figure><img src="k-e-fas-sverhu.jpg"><figcaption>3. Фас чуть сверху: она поднимает глаза в объектив, внизу голова кота</figcaption></figure><figure><img src="k-e-polufas.jpg"><figcaption>4. Почти фас, справа: поворачивает лицо к нам, лампа размыта сзади</figcaption></figure></main></body></html>
