<h1>Переход к части 2: раскадровка</h1><figure><img src="k-final.jpg"><figcaption>1. «…я приду за тобой». Врывается тема любви, кадр замирает <span>3 с</span></figcaption></figure><figure><img src="k-f-titry.jpg"><figcaption>2. Музыка играет дальше, кадр темнеет, идут старые титры <span>4 с</span></figcaption></figure><figure><img src="k-f-ruka.jpg"><figcaption>3. Из-за края кадра появляется современная рука с маникюром и хватает старый кадр, как фотографию. Музыка обрывается <span>2 с</span></figcaption></figure><figure><img src="k-f-sdvig.jpg"><figcaption>4. Настя сдвигает старый кадр в сторону. За ним светлый современный офис, Настя в бежевом костюме: «Так, стоп-стоп-стоп…» <span>3 с</span></figcaption></figure><figure><img src="k-f-ona.jpg"><figcaption>5. Настя в кадре одна, в объектив: «…сейчас всё по-другому». Дальше часть 2 <span>3 с</span></figcaption></figure>
<h2>Другой вариант шагов 3–4</h2><figure><img src="k-f-tv.jpg"><figcaption>Старый фильм идёт по старому телевизору в современном офисе. Настя отодвигает телевизор рукой и улыбается в объектив.</figcaption></figure></main></body></html>
